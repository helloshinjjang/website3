  var x = (typeof apxInsts === "function" ? apxInsts() : []).filter(function(i){ return i.id === id; })[0];

function evalOf(sid,kind){ return DB.evaluations.filter(function(e){return e.studentId===sid&&e.kind===kind;})[0]; }
function attSummary(list){
  var c={PRESENT:0,LATE:0,EARLY_LEAVE:0,ABSENT:0,HOLIDAY:0,MAKEUP:0};
  list.forEach(function(r){ c[r.status]=(c[r.status]||0)+1; });
  var counted=list.filter(function(r){return r.status!=="HOLIDAY";});
  var pres=counted.filter(function(r){return PRESENT_LIKE.indexOf(r.status)>=0;});
  c.rate = counted.length? Math.round(pres.length/counted.length*100):0;
  c.done = pres.length; c.days = counted.length;
  c.pending = list.filter(function(r){return r.approvalStatus==="PENDING";}).length;
  return c;
}
function logStat(sid){
  var ls=logsOf(sid);
  return { submitted: ls.filter(function(l){return l.status!=="DRAFT";}).length,
    approved: ls.filter(function(l){return l.status==="APPROVED";}).length,
    returned: ls.filter(function(l){return l.status==="RETURNED";}).length,
    pendingFaculty: 0,   // 지도교수 매회 승인 없음 (현장 담당자 결재로 승인 완료)
    pendingField: ls.filter(function(l){return l.status==="SUBMITTED";}).length };
}
/* 학번별 실습 기준 — 2025학번까지 3주 120시간, 2026학번부터 4주 160시간 */
function reqOf(s){
  var r = DB.term.rules, y = parseInt(String((s&&s.no)||"").slice(0,4), 10);
  var o = (isFinite(y) && y <= r.cohortUntil) ? r.old : r.neu;
  return { weeks:o.weeks, hours:o.hours, days:o.days, logs:o.logs, label:o.weeks+"주 "+o.hours+"시간" };
}
/* 지도교수 성적: 영역별 입력칸(교수마다 영역·배점 상이, 만점 100) */
function gradeAreasMax(){ return DB.grading.areas.reduce(function(t,a){ return t+(Number(a.max)||0); },0); }
function gradeTotal(sid){
  var sc = DB.grading.scores[sid]; if(!sc) return null;
  var ok = DB.grading.areas.every(function(a){ return sc[a.id]!=="" && sc[a.id]!=null && isFinite(Number(sc[a.id])); });
  if(!ok) return null;
  return Math.round(DB.grading.areas.reduce(function(t,a){ return t+Number(sc[a.id]); },0)*10)/10;
}
function finalScore(sid){ return gradeTotal(sid); }
/* 실습생 평가표(기관) 항목 — 기관별 세팅 */
function evalItemsFor(iid){ return (DB.evalItemsInst[iid] && DB.evalItemsInst[iid].length) ? DB.evalItemsInst[iid] : DB.evalItems.FIELD; }
function evalTotal(items, sc){
  var mx = items.reduce(function(t,it){ return t+(Number(it.max)||0); },0) || 1;
  var sum = items.reduce(function(t,it){ var v=Number(sc[it.id]); return t+(isFinite(v)?v:0); },0);
  return Math.round(sum*100/mx);
}

  USERS = loadUsers();

function sigInit(prefix){

  function mv(e){ if(!draw)return; var p=pos(e); x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; c.dataset.ink="1"; if(e.cancelable)e.preventDefault(); }

function sigRead(prefix){

  for (var k=0;k<os.length;k++){ os[k].addEventListener("click", function(){ opts.onOpen(this.getAttribute("data-open")); }); }
  var as = wrap.querySelectorAll("[data-add]");
  for (var j=0;j<as.length;j++){ as[j].addEventListener("click", function(){ opts.onAdd(this.getAttribute("data-add")); }); }

function permAnc(k){ var p=k.split("."), a=[]; for(var i=1;i<p.length;i++) a.push(p.slice(0,i).join(".")); return a.filter(function(x){ return PERM_ALL.indexOf(x)>=0; }); }

function resolvePerms(role, ov, roleDefs){
  roleDefs = roleDefs || DEFAULT_ROLE_PERMS;
  var s = {}; (roleDefs[role]||[]).forEach(function(k){ s[k]=1; });
  if (ov){ (ov.revoke||[]).forEach(function(k){ delete s[k]; }); (ov.grant||[]).forEach(function(k){ s[k]=1; }); }
  return s;
}
function togglePerm(ov, role, key, next){
  var targets = permDesc(key), def = {}; (DEFAULT_ROLE_PERMS[role]||[]).forEach(function(k){ def[k]=1; });
  var g = {}, r = {}; (ov.grant||[]).forEach(function(k){ g[k]=1; }); (ov.revoke||[]).forEach(function(k){ r[k]=1; });
  targets.forEach(function(k){
    if (next){ delete r[k]; if (def[k]) delete g[k]; else g[k]=1; }
    else { delete g[k]; if (def[k]) r[k]=1; else delete r[k]; }
  });
  if (next) permAnc(key).forEach(function(a){ if(!def[a]) g[a]=1; delete r[a]; });
  return { grant:Object.keys(g), revoke:Object.keys(r) };
}
function toggleRoleDef(cur, key, next){
  var s = {}; cur.forEach(function(k){ s[k]=1; });
  permDesc(key).forEach(function(k){ if (next) s[k]=1; else delete s[k]; });
  if (next) permAnc(key).forEach(function(a){ s[a]=1; });
  return PERM_ALL.filter(function(k){ return s[k]; });
}

  var ks = PERM_FLAT.filter(function(p){ return p.cat===catKey; }).map(function(p){ return p.key; });
  var on = ks.filter(function(k){ return granted[k]; }).length;
  return on===0 ? "none" : on===ks.length ? "all" : "some";
}

/* 이미지 첨부 (실습일지·과제·학습 기록) — 800px로 축소해 메모리에만 보관 */
function readPhotos(files, cb){
  var arr = [].slice.call(files || []).filter(function(f){ return /^image\//.test(f.type); });
  var n = arr.length, out = [];
  if (!n){ cb([]); return; }
  function done(){ if (--n === 0) cb(out); }
  arr.forEach(function(f){
    var fr = new FileReader();
    fr.onerror = done;
    fr.onload = function(){
      var img = new Image();
      img.onerror = done;
      img.onload = function(){
        var k = Math.min(1, 800 / Math.max(img.width, img.height));
        var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        out.push({ name:f.name, dataUrl:c.toDataURL("image/jpeg", 0.72) }); done();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
}

function apxGpaConv(v){ var n = parseFloat(v); if (v === "" || v == null || isNaN(n)) return ""; return (Math.round(n / APX.GPA_FORM_MAX * APX.GPA_CONV_MAX * 100) / 100).toFixed(2); }
/* ---------- 선발 기준 = 기초 코드(마스터 코드) ----------
   시스템 관리자 [기초 코드] · 지도교수 [선발 기준 코드]에서 수정하면
   선발 기준 안내 · 점수 계산기 · 신청서 · 선발 평가표에 바로 반영됩니다. */
var SEL_GROUPS = [
  { code:"SEL_SCORE", name:"선발 · 배점 및 기준값", fields:["value"], items:[
    ["GPA_WEIGHT","학점 배점",40],["INTRO_WEIGHT","자기소개서 배점 (교수진 평가)",40],["GPA_MAX","학점(평점평균) 만점",4.3],["GPA_CONV","환산 표시 만점",4.5],["INTRO_LEN","자기소개서 최대 글자 수",1000],["INTRO_MIN","자기소개서 최소 글자 수",500]] },
  { code:"SEL_CERT", name:"선발 · 인정 자격증", fields:[], items:[
    ["ADSP","ADsP (데이터분석 준전문가)"],["COMP1","컴퓨터활용능력 1급"],["SURVEY","사회조사분석사"],["SAS","SAS 관련 자격증"],["SQL","SQL 관련 자격증"]] },
  { code:"SEL_CERT_PTS", name:"선발 · 자격증 점수 (인정 개수별)", fields:["value"], items:[
    ["CNT0","0개",6],["CNT1","1개",7],["CNT2","2개",8],["CNT3","3개",9],["CNT4","4개 이상",10]] },
  { code:"SEL_TOEIC", name:"선발 · 토익 점수 구간", fields:["min","value"], items:[
    ["T750","750점 이상",10,750],["T700","700 – 749점",9,700],["T650","650 – 699점",8,650],["T600","600 – 649점",7,600],["NONE","600점 미만 · 점수 없음",6,0]] }
];
(function selCodesInit(){
  SEL_GROUPS.forEach(function(g){
    if (!DB.codeGroups.some(function(x){ return x.code === g.code; })) DB.codeGroups.push({ code:g.code, name:g.name, fields:g.fields, sel:true });
    if (!DB.codes[g.code]) DB.codes[g.code] = g.items.map(function(r, i){
      var c = { id:"sel_"+g.code+"_"+r[0], code:r[0], label:r[1], sort:i+1, active:true };
      if (r[2] !== undefined) c.value = r[2];
      if (r[3] !== undefined) c.min = r[3];
      return c;
    });
  });
})();
function selCfg(){
  function act(g){ return (DB.codes[g]||[]).filter(function(c){ return c.active; }).sort(function(a,b){ return a.sort - b.sort; }); }
  var sc = {}; act("SEL_SCORE").forEach(function(c){ sc[c.code] = Number(c.value); });
  function num(k, d){ return isFinite(sc[k]) && sc[k] > 0 ? sc[k] : d; }
  var pts = act("SEL_CERT_PTS"), bands = act("SEL_TOEIC").slice().sort(function(a,b){ return (Number(b.min)||0) - (Number(a.min)||0); });
  var certPts = pts.length ? pts.map(function(c){ return Number(c.value)||0; }) : [0];
  var toeicMax = bands.length ? Math.max.apply(null, bands.map(function(b){ return Number(b.value)||0; })) : 0;
  var toeicMin = bands.length ? Math.min.apply(null, bands.map(function(b){ return Number(b.value)||0; })) : 0;
  var cfg = {
    gpaW: num("GPA_WEIGHT", 40), introW: num("INTRO_WEIGHT", 40), gpaMax: num("GPA_MAX", 4.3), gpaConv: num("GPA_CONV", 4.5), introLen: Math.round(num("INTRO_LEN", 1000)), introMin: Math.round(num("INTRO_MIN", 500)),
    certs: act("SEL_CERT").map(function(c){ return c.label; }),
    certPts: certPts, certLabels: pts.map(function(c){ return c.label; }), certMax: Math.max.apply(null, certPts),
    bands: bands.map(function(b){ return { label:b.label, min:Number(b.min)||0, pts:Number(b.value)||0 }; }), toeicMax: toeicMax, toeicMin: toeicMin
  };
  cfg.quantMax = Math.round((cfg.gpaW + cfg.certMax + cfg.toeicMax) * 10) / 10;
  cfg.total = Math.round((cfg.quantMax + cfg.introW) * 10) / 10;
  return cfg;
}
/* 예전 상수 이름(APX.GPA_CRIT_MAX 등)은 마스터 코드 값을 돌려주도록 연결 */
Object.defineProperty(APX, "GPA_CRIT_MAX", { get:function(){ return selCfg().gpaMax; }, configurable:true });
Object.defineProperty(APX, "GPA_FORM_MAX", { get:function(){ return selCfg().gpaMax; }, configurable:true });
Object.defineProperty(APX, "GPA_CONV_MAX", { get:function(){ return selCfg().gpaConv; }, configurable:true });
Object.defineProperty(APX, "INTRO_LEN", { get:function(){ return selCfg().introLen; }, configurable:true });
Object.defineProperty(APX, "INTRO_MIN", { get:function(){ return Math.min(selCfg().introMin, selCfg().introLen); }, configurable:true });
Object.defineProperty(APX, "CERTS", { get:function(){ return selCfg().certs; }, configurable:true });
function apxCertPts(n){ var p = selCfg().certPts; return p[Math.max(0, Math.min(n, p.length - 1))]; }
function apxToeicPts(sc){
  var c = selCfg();
  if (sc != null) for (var i = 0; i < c.bands.length; i++){ if (sc >= c.bands[i].min) return c.bands[i].pts; }

/* 신청자 목록 = 예시 10건 + 실제 학생 신청서(임시 저장·제출) */
function apxApplicants(){
  var list = apxSeedApps().slice();
  DB.students.forEach(function(s){
    var ex = DB.studentExtra[s.id], a = ex && ex.apply;
    if (a && (a.status === "SUBMITTED" || a.savedAt)){
      var reop = applyUnlockPending(ex);
      list.push({ id:"stu_"+s.id, sid:s.id, name:s.name, no:s.no, a: reop ? Object.assign({}, a, { status:"DRAFT" }) : a, reopening:reop,
        editReq: ex.applyEditReq && !ex.applyEditReq.rejected && a.status === "SUBMITTED" && !reop ? ex.applyEditReq : null });
    }
  });
  return list.sort(function(x, y){ return noCmp(x.no, y.no) || noCmp(x.name, y.name); });   // 학번 순
}
function apxNorm(n){ return String(n||"").replace(/\s+/g, "").toLowerCase(); }
/* 필수 조건 충족 여부 — 학생이 신청서에서 직접 체크한 값. (예전 신청서처럼 체크 칸이 없으면 지도교수 확인 값을 그대로 사용) */
function apxHasConds(app){ return !!(app.a && app.a.conds && typeof app.a.conds === "object"); }
function apxCondOK(app, cond){ return apxHasConds(app) ? !!app.a.conds[cond] : !!((apxSel().cond[app.id]||{})[cond]); }
function apxCondList(){ var o = []; apxInsts().forEach(function(x){ if (x.open && x.cond && o.indexOf(x.cond) < 0) o.push(x.cond); }); return o; }
function apxCertList(a){
  return (a.certs||[]).map(function(c){
    var nm = c.name === "__other" ? c.other.trim() : c.name;
    return nm ? { name:nm, ok: c.name !== "__other" && APX.CERTS.indexOf(c.name) >= 0 } : null;
  }).filter(Boolean);
}
function apxScore(app){
  var a = app.a, sel = apxSel();
  var g = parseFloat(a.gpa); g = isNaN(g) ? 0 : Math.max(0, Math.min(APX.GPA_CRIT_MAX, g));
  var gp = Math.round(g / APX.GPA_CRIT_MAX * selCfg().gpaW * 10) / 10;
  var certs = apxCertList(a), cn = certs.filter(function(c){ return c.ok; }).length, cp = apxCertPts(cn);
  var isToeic = a.eng && a.eng.test === "TOEIC" && String(a.eng.score).trim() !== "";
  var t = isToeic ? parseInt(a.eng.score, 10) : null; if (isNaN(t)) t = null;
  var tp = apxToeicPts(t);
  var quant = Math.round((gp + cp + tp) * 10) / 10;
  var intro = sel.scores[app.id]; intro = (intro === undefined || intro === "" || intro === null) ? null : Number(intro);
  return { gpa:g, gp:gp, certs:certs, cn:cn, cp:cp, toeic:t, tp:tp, quant:quant, intro:intro, total: Math.round((quant + (intro||0)) * 10) / 10 };
}
/* ============================================================ *
 *  실습기관 자동 배정 (PLC)
 *  ─ 결과 행 형식 (DB 테이블 placement_results 와 같은 칸)
 *    { app_id, student_id, student_no, name, score, quant, gpa, submitted_at,
 *      wish1, wish2, wish3, inst_id, inst_name, round, status:"ASSIGNED"|"UNASSIGNED", reason, detail }
 *  ─ PLC.saved : 저장된 결과 (실제 모드: 서버 placement_results / 데모: 메모리)
 *    PLC.draft : [자동 배정 실행] 후 아직 저장하지 않은 결과
 *    둘 다 { runAt, savedAt, rows:[...], caps:[{id,name,grp,cap,cond}] }
 * ============================================================ */
var PLC = { saved:null, draft:null, busy:false };
function plcCur(){ return PLC.draft || PLC.saved; }
function plcWishNames(app){ return [0,1,2].map(function(i){ return String((app.a.hosp[i]||{}).name || "").trim(); }); }
/* 신청서의 n순위 기관명 → 모집 중인 실습기관 (학생이 고른 이름 그대로 연결. 교수가 임의로 다른 기관에 연결하지 않음) */
function apxChoiceInst(app, i){
  var n = apxNorm(app.a.hosp[i] && app.a.hosp[i].name); if (!n) return null;
  return apxInsts().filter(function(x){ return apxNorm(x.name) === n; })[0] || null;
}
/* 선발 우선순위 (동점자 처리 기준)
 *   1) 총점(정량 + 자기소개) 높은 순
 *   2) 정량 점수 높은 순        ← 기존 프로젝트 기준
 *   3) 학점(평점) 높은 순       ← 기존 프로젝트 기준
 *   4) 신청서 제출 일시가 빠른 순  ← 추가 보조 기준
 *   5) 학번 오름차순            ← 마지막 보조 기준 (항상 같은 순서가 나오도록) */
function plcCmp(A, B){
  return (B.score - A.score) || (B.quant - A.quant) || (B.gpa - A.gpa) ||
    (String(A.submitted_at||"9999") < String(B.submitted_at||"9999") ? -1 : String(A.submitted_at||"9999") > String(B.submitted_at||"9999") ? 1 : 0) ||
    (String(A.student_no) < String(B.student_no) ? -1 : String(A.student_no) > String(B.student_no) ? 1 : 0) ||
    (A.app_id < B.app_id ? -1 : A.app_id > B.app_id ? 1 : 0);
}
/* 자동 배정 — 1순위 → 2순위 → 3순위. 각 차수는 앞 차수에서 배정받지 못한 학생만 대상.
 * 정원이 남은 기관이라도 학생이 희망하지 않은 기관에는 배정하지 않음. */
function plcRun(apps){
  var insts = apxInsts().filter(function(x){ return x.open; });
  var caps = insts.map(function(x){ return { id:x.id, name:x.name, grp:x.grp, cap:Math.max(0, Number(x.cap)||0), cond:x.cond||"" }; });
  var seats = {}; caps.forEach(function(c){ seats[c.id] = c.cap; });
  var sel = apxSel();
  var rows = apps.filter(function(p){ return p.a.status === "SUBMITTED"; }).map(function(p){
    var s = apxScore(p), w = plcWishNames(p);
    return { app_id:p.id, student_id:p.sid || null, student_no:String(p.no||""), name:p.name, score:s.total, quant:s.quant, gpa:s.gpa,
      submitted_at:p.a.submittedAt || null, wish1:w[0], wish2:w[1], wish3:w[2], inst_id:null, inst_name:"", round:null,
      status:"UNASSIGNED", reason:"", detail:"", _p:p, _full:false, _bad:false, _notes:[] };
  });
  for (var r = 0; r < 3; r++){
    var groups = {};
    rows.forEach(function(row){
      if (row.status === "ASSIGNED") return;           // 앞 순위에서 배정된 학생은 제외
      var nm = row["wish"+(r+1)]; if (!nm) return;
      var it = apxChoiceInst(row._p, r);
      if (!it || seats[it.id] === undefined){ row._bad = true; row._notes.push((r+1)+"순위: 모집 기관 목록에 없음"); return; }
      if (it.cond && !apxCondOK(row._p, it.cond)){ row._bad = true; row._notes.push((r+1)+"순위: 필수 조건 미충족 ("+it.cond+")"); return; }
      (groups[it.id] = groups[it.id] || []).push(row);
    });
    Object.keys(groups).forEach(function(iid){
      var it = caps.filter(function(c){ return c.id === iid; })[0];
      groups[iid].sort(plcCmp).forEach(function(row){
        if (seats[iid] > 0){ seats[iid]--; row.status = "ASSIGNED"; row.inst_id = iid; row.inst_name = it.name; row.round = r+1; }
        else { row._full = true; row._notes.push((r+1)+"순위: 정원 초과 ("+it.name+" "+it.cap+"명)"); }
      });
    });
  }
  rows.forEach(function(row){
    row.detail = row._notes.join(" · ");          // 순위별로 배정되지 않은 이유 (배정된 학생도 앞 순위 사유 기록)
    if (row.status === "ASSIGNED") return;
    row.reason = !(row.wish1 || row.wish2 || row.wish3) ? "희망 기관 미선택" : row._full ? "희망 기관 정원 초과" : "희망 기관 배정 불가";
  });

    rows:rows.map(function(x){ var o = {}; Object.keys(x).forEach(function(k){ if (k.charAt(0) !== "_") o[k] = x[k]; }); return o; }) };
}
/* 저장 전 검증: 정원 초과 · 중복 배정 · 희망하지 않은 기관 배정 · 순위 오류 */
function plcValidate(res){
  var err = [], seen = {}, cnt = {}, capOf = {};
  (res.caps||[]).forEach(function(c){ capOf[c.id] = c; });
  (res.rows||[]).forEach(function(r){
    if (seen[r.app_id]) err.push(r.name+" ("+r.student_no+"): 중복 배정");
    seen[r.app_id] = 1;
    if (r.status === "ASSIGNED"){
      var c = capOf[r.inst_id];
      if (!c) { err.push(r.name+": 모집 기관이 아닌 곳에 배정됨"); return; }
      if ([1,2,3].indexOf(r.round) < 0) err.push(r.name+": 배정 순위 오류");
      else if (apxNorm(r["wish"+r.round]) !== apxNorm(c.name)) err.push(r.name+": "+r.round+"순위 희망 기관이 아닌 곳에 배정됨");
      cnt[r.inst_id] = (cnt[r.inst_id]||0) + 1;
    } else if (r.inst_id) err.push(r.name+": 미배정인데 기관이 지정됨");
  });
  Object.keys(cnt).forEach(function(id){ if (cnt[id] > capOf[id].cap) err.push(capOf[id].name+": 정원 "+capOf[id].cap+"명 초과 ("+cnt[id]+"명)"); });
  return err;
}
/* 기관별 집계 (round 지정 시 그 순위까지 누적) */
function plcByNo(a, b){ return noCmp(a.student_no, b.student_no) || noCmp(a.name, b.name); }
function plcInstStat(res){
  return (res.caps||[]).map(function(c){
    var got = res.rows.filter(function(r){ return r.status === "ASSIGNED" && r.inst_id === c.id; });
    var by = [1,2,3].map(function(k){ return got.filter(function(r){ return r.round === k; }).length; });
    return { id:c.id, name:c.name, grp:c.grp, cap:c.cap, cond:c.cond, got:got, n:got.length, by:by, left:c.cap - got.length, rate:c.cap ? got.length / c.cap : 0 };
  });
}
/* 배정 실행 이후 점수·신청 내용·정원이 바뀌었는지 */
function plcStale(res, apps){
  if (!res) return [];
  var out = [], now = {};
  apps.filter(function(p){ return p.a.status === "SUBMITTED"; }).forEach(function(p){ now[p.id] = p; });
  var ids = Object.keys(now);
  if (ids.length !== res.rows.length || res.rows.some(function(r){ return !now[r.app_id]; })) out.push("제출된 신청서 수가 달라졌습니다");
  if (res.rows.some(function(r){ var p = now[r.app_id]; if (!p) return false; var w = plcWishNames(p); return Math.abs(apxScore(p).total - r.score) > 1e-9 || w[0] !== r.wish1 || w[1] !== r.wish2 || w[2] !== r.wish3; })) out.push("학생 점수(자기소개 채점 등) 또는 희망 기관이 바뀌었습니다");
  var curCaps = {}; apxInsts().filter(function(x){ return x.open; }).forEach(function(x){ curCaps[x.id] = x; });
  if (Object.keys(curCaps).length !== res.caps.length || res.caps.some(function(c){ var x = curCaps[c.id]; return !x || (Number(x.cap)||0) !== c.cap || x.name !== c.name; })) out.push("실습기관 목록 또는 정원이 바뀌었습니다");
  return out;
}

/* ---------- 저장 · 불러오기 · 초기화 (실제 모드: 서버 함수 / 데모: 메모리) ---------- */
function plcErr(e){
  var m = (e && (e.message || e.details)) || String(e || "");
  if (/CONFLICT/.test(m)) return "다른 사용자가 그사이 배정 결과를 저장했습니다. [최신 내용 불러오기]로 새로 불러온 뒤 다시 실행하세요.";
  if (/OVER_CAP:?(.*)/.test(m)) return "정원 초과: " + m.split("OVER_CAP:")[1];
  if (/DUPLICATE_STUDENT/.test(m)) return "한 학생이 중복 배정되어 저장하지 않았습니다.";
  if (/NOT_WISH:?(.*)/.test(m)) return "학생이 희망하지 않은 기관에 배정된 항목이 있어 저장하지 않았습니다: " + (m.split("NOT_WISH:")[1]||"");
  if (/NOT_SUBMITTED:?(.*)/.test(m)) return "제출하지 않은 신청서가 포함되어 있습니다: " + (m.split("NOT_SUBMITTED:")[1]||"");
  if (/BAD_INST:?(.*)/.test(m)) return "모집 중인 기관이 아닌 곳이 포함되어 있습니다: " + (m.split("BAD_INST:")[1]||"");
  if (/NO_INSTS/.test(m)) return "서버에 실습기관 목록이 아직 저장되지 않았습니다. [실습기관 관리]를 한 번 저장한 뒤 다시 시도하세요.";
  if (/NOT_FACULTY/.test(m)) return "지도교수 또는 관리자만 할 수 있습니다.";
  if (/COND_UNMET:?(.*)/.test(m)) return "필수 조건 과목을 이수하지 않은 학생이 그 기관에 배정되어 저장하지 않았습니다: " + (m.split("COND_UNMET:")[1]||"");
  return m;
}

/* ---------- 엑셀(.xlsx) — ExcelJS (필요할 때만 불러옴) ---------- */
var XLSX_SRC = "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
function xlsxLib(){
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);

    s.onerror = function(){ xlsxLib.p = null; no(new Error("엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.")); };
    document.head.appendChild(s);

var XL_FILL = { head:"FF2E6B74", r1:"FFE3F0F1", r2:"FFE8EEF8", r3:"FFFBF3E3", un:"FFFCEDEA", sum:"FFF5F7F8" };
/* 시트 하나: 제목(1행) · 설명(2행) · 머리글(3행 · 굵게 · 고정 · 필터) · 데이터 */
function xlSheet(wb, name, title, sub, cols, rows, rowFill){
  var ws = wb.addWorksheet(name, { views:[{ state:"frozen", ySplit:3 }] });
  var n = cols.length;
  ws.mergeCells(1, 1, 1, n); ws.getCell(1, 1).value = title;
  ws.getCell(1, 1).font = { bold:true, size:14, color:{ argb:"FF13212B" } };
  ws.getRow(1).height = 24;
  ws.mergeCells(2, 1, 2, n); ws.getCell(2, 1).value = sub;
  ws.getCell(2, 1).font = { size:10, color:{ argb:"FF6B7680" } };
  var hr = ws.getRow(3);
  cols.forEach(function(c, i){
    var cell = hr.getCell(i+1); cell.value = c.h;
    cell.font = { bold:true, color:{ argb:"FFFFFFFF" } };
    cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:XL_FILL.head } };
    cell.alignment = { vertical:"middle", horizontal:"center", wrapText:true };
    cell.border = { bottom:{ style:"thin", color:{ argb:"FF245860" } } };
  });
  hr.height = 22;
  rows.forEach(function(r, ri){
    var row = ws.getRow(4 + ri);
    cols.forEach(function(c, i){
      var v = r[c.k], cell = row.getCell(i+1);
      if (v !== undefined && v !== null && v !== "") cell.value = v;   // 빈 값은 진짜 빈 칸으로
      if (c.fmt) cell.numFmt = c.fmt;
      cell.alignment = { vertical:"middle", horizontal: c.al || (typeof v === "number" ? "right" : "left"), wrapText: !!c.wrap };
      cell.border = { bottom:{ style:"hair", color:{ argb:"FFD5DBDF" } } };
    });
    var f = rowFill && rowFill(r); if (f) cols.forEach(function(c, i){ row.getCell(i+1).fill = { type:"pattern", pattern:"solid", fgColor:{ argb:f } }; });
  });
  if (rows.length) ws.autoFilter = { from:{ row:3, column:1 }, to:{ row:3 + rows.length, column:n } };
  else ws.autoFilter = { from:{ row:3, column:1 }, to:{ row:3, column:n } };
  // 열 너비 자동 조정 (한글은 2칸으로 계산)
  cols.forEach(function(c, i){
    var w = [c.h].concat(rows.map(function(r){ var v = r[c.k]; return v == null ? "" : (c.fmt === "0.0%" && typeof v === "number" ? (v*100).toFixed(1)+"%" : String(v)); }))
      .reduce(function(m, s){ var len = 0; for (var j=0;j<s.length;j++) len += s.charCodeAt(j) > 255 ? 2 : 1; return Math.max(m, len); }, 0);
    ws.getColumn(i+1).width = Math.min(c.max || 60, Math.max(c.min || 8, w + 3));
  });
  return ws;
}
function plcYear(){ var m = String(DB.term.name||"").match(/(20\d\d)/); return m ? m[1] : String(new Date().getFullYear()); }
function plcFileName(suffix){ return plcYear() + "학년도_현장실습기관_" + suffix + ".xlsx"; }
async function xlDownload(wb, fname){

  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();

var PLC_ST = function(r){ return r.status === "ASSIGNED" ? "배정 완료" : "미배정"; };
function plcRowsAll(res){ return res.rows.map(function(r, i){ return { rank:i+1, name:r.name, no:r.student_no, score:r.score, w1:r.wish1||"-", w2:r.wish2||"-", w3:r.wish3||"-",
  inst:r.inst_name||"-", round:r.round ? r.round+"순위" : "-", st:PLC_ST(r), reason:r.reason||"", _r:r }; }); }
function plcRowsRound(res, k){
  var st = plcInstStat(res), out = [];

    var list = s.got.filter(function(r){ return r.round === k; }).sort(plcByNo);
    var base = { inst:s.name, grp:s.grp, cap:s.cap, nk:s.by[k-1], cum:cum, left:s.cap - cum };
    if (!list.length) out.push(Object.assign({ name:"(이 순위 배정 없음)", no:"", score:null, wish:"" }, base));
    list.forEach(function(r){ out.push(Object.assign({ name:r.name, no:r.student_no, score:r.score, wish:r["wish"+k] }, base)); });
  });

}

document.addEventListener("change", function(e){
  if (REAL) return;
  var inp = e.target; if (!inp || inp.type !== "file" || !inp.files || !inp.files[0]) return;
  var key = realFileKey(inp), sid = (SESSION||{}).studentId; if (!key || !sid) return;
  DEMO_FILES[sid + "|" + key] = URL.createObjectURL(inp.files[0]); DEMO_FILE_NAMES[sid + "|" + key] = inp.files[0].name;
}, true);
function apxFileBtn(p, path, fname){
  if (!fname) return '<span class="mu">없음</span>';
  var key = "apply." + path;
  if (REAL && p.sid){
    var all = RS.files[p.sid] || {}, f = all[key];
    if (!f || f.name !== fname){ var k2 = Object.keys(all).filter(function(k){ return k.indexOf("apply.") === 0 && all[k].name === fname; })[0]; if (k2){ key = k2; f = all[k2]; } }
    if (f) return '<button type="button" class="lnk as-file" data-rfile="'+esc(p.sid)+'|'+esc(key)+'">📄 '+esc(fname)+' <span>열기</span></button>';
  }
  var u = p.sid && DEMO_FILES[p.sid + "|" + key];
  if (u) return '<a class="lnk as-file" href="'+u+'" target="_blank" rel="noopener">📄 '+esc(fname)+' <span>열기</span></a>';
  return '<span>'+esc(fname)+'</span> <span class="tiny mu">(원본 파일 없음'+(p.demo?' · 예시 데이터':'')+')</span>';
}

/* ---------- 신청서 한 장 (신청서 현황 · 미배정 학생 상세에서 함께 사용) ---------- */
function apxAppSheet(p, opts){
  opts = opts || {};
  var a = p.a, s = apxScore(p), sel = apxSel();
  var ex = p.sid ? (DB.studentExtra[p.sid] || {}) : null;
  var lock = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  var st = a.status === "SUBMITTED" ? '<span class="tag ok">제출 완료 · '+esc(fmtDT(a.submittedAt))+'</span>' : '<span class="tag wn">작성 중'+(a.savedAt?' · 임시 저장 '+esc(fmtDT(a.savedAt)):'')+'</span>';
  var photo = /^data:image\//.test(a.photo||"") ? '<img class="as-photo" src="'+esc(a.photo)+'" alt="'+esc(p.name)+' 증명사진">' : '<div class="as-photo none">사진<br>'+(a.photoName?'첨부됨':'없음')+'</div>';
  // 1. 학생 기본 정보
  var basic = '<section class="as-sec"><h5 class="as-h"><span class="as-n">1</span>학생 기본 정보</h5><div class="as-basic">'+photo+'<dl class="as-dl">' +
    '<div><dt>이름</dt><dd><b>'+esc(p.name)+'</b>'+(p.demo?' <span class="tag gy">예시</span>':'')+'</dd></div>' +
    '<div><dt>학번</dt><dd class="mono">'+esc(p.no||"-")+'</dd></div>' +
    '<div><dt>신청 상태</dt><dd>'+st+'</dd></div>' +
    '<div><dt>이수 학점</dt><dd class="mono">'+esc(a.credits||"-")+'</dd></div>' +
    '<div><dt>평점 평균</dt><dd class="mono">'+esc(a.gpa||"-")+' / '+APX.GPA_FORM_MAX+' <span class="mu">('+APX.GPA_CONV_MAX+' 환산 '+(apxGpaConv(a.gpa)||"-")+')</span></dd></div>' +
    '<div><dt>정량 점수</dt><dd><span class="mono">학점 '+s.gp.toFixed(1)+' · 자격증 '+s.cp+' · 토익 '+s.tp+' = <b>'+s.quant.toFixed(1)+'</b></span> / '+selFmt(selCfg().quantMax)+'</dd></div>' +
    '</dl></div></section>';
  // 2~4. 희망 기관 1~3순위 (읽기 전용)
  var wishes = [0,1,2].map(function(i){
    var nm = String((a.hosp[i]||{}).name||"").trim(), it = nm ? apxChoiceInst(p, i) : null;
    var body = !nm ? '<div class="as-wish-v mu">선택하지 않음</div>' :
      '<div class="as-wish-v"><b>'+esc(nm)+'</b>' + (it ? ' <span class="tag gy">'+esc(it.grp)+'</span> <span class="tag br">정원 '+(Number(it.cap)||0)+'명</span>' : ' <span class="tag wn">모집 기관 목록에 없음</span>') + '</div>' +
      (it && it.cond ? '<div class="as-cond">필수 조건: '+esc(it.cond)+' · '+(apxCondOK(p, it.cond) ? '<span class="ok-t">'+(apxHasConds(p)?'학생 이수 체크':'충족 확인됨')+'</span>' : '<span class="wn-t">'+(apxHasConds(p)?'이수 안 함 (배정 제외)':'확인 전')+'</span>')+'</div>' : '');
    return '<section class="as-sec as-wish"><h5 class="as-h"><span class="as-n">'+(i+2)+'</span>실습 희망 기관 '+(i+1)+'순위 <span class="as-ro" title="학생이 제출한 내용으로 수정할 수 없습니다">'+lock+' 읽기 전용</span></h5>'+body+'</section>';
  }).join("");
  // 5. 필수 이수 과목 자가 체크 결과
  var PC = DB.guide.prereqCourses || [];

  else {
    var pr = ex.prereq || {}, done = PC.filter(function(c){ return pr[c.name]; }), miss = PC.filter(function(c){ return !pr[c.name]; });

      '<div class="as-pre">'+PC.map(function(c){ var on = !!pr[c.name]; return '<span class="as-pc'+(on?' on':'')+'" title="'+c.y+'학년 '+c.t+'학기">'+(on?'✓ ':'✗ ')+esc(c.name)+'</span>'; }).join("")+'</div>';
  }
  var preSec = '<section class="as-sec"><h5 class="as-h"><span class="as-n">5</span>필수 이수 과목 자가 체크 결과 <span class="as-ro">'+lock+' 학생 작성</span></h5>'+pre+'</section>';
  // 6. 필수 조건 확인 (지도교수 관리 기능 · 기존 기능 유지)
  var conds = []; [0,1,2].forEach(function(i){ var it = apxChoiceInst(p, i); if (it && it.cond && conds.indexOf(it.cond) < 0) conds.push(it.cond); });
  var condSec;
  if (apxHasConds(p)){
    var allC = apxCondList().concat(Object.keys(a.conds).filter(function(c){ return a.conds[c]; })).filter(function(c, i, arr){ return arr.indexOf(c) === i; });
    condSec = '<section class="as-sec"><h5 class="as-h"><span class="as-n">6</span>필수 조건 과목 이수 <span class="as-ro">'+lock+' 학생 체크</span></h5>' +

        (conds.some(function(c){ return !a.conds[c]; }) ? '<p class="tiny wn-t" style="margin-top:6px">조건을 이수하지 않은 기관은 배정에서 제외됩니다.</p>' : '')
        : '<p class="mu sm">필수 조건이 있는 기관이 없습니다.</p>') + '</section>';
  } else {
    condSec = '<section class="as-sec"><h5 class="as-h"><span class="as-n">6</span>필수 조건 확인 <span class="mu sm" style="font-weight:500">예전 신청서 · 지도교수 확인</span></h5>' +
      (conds.length ? conds.map(function(c){ var on = (sel.cond[p.id]||{})[c]; return '<label class="ck" style="display:flex;margin:6px 0"><input type="checkbox" data-cond="'+esc(c)+'"'+(on?' checked':'')+(opts.readonly?' disabled':'')+'> '+esc(c)+' 충족 확인</label>'; }).join("") + '<p class="tiny mu">이 신청서는 학생 체크 칸이 생기기 전에 제출되어 지도교수가 확인합니다.</p>' : '<p class="mu sm">희망 기관에 필수 조건이 없습니다.</p>') + '</section>';
  }
  // 7. 자격증 · 영어 · 증명서 파일 (눌러서 원본 열기)
  var certRows = (a.certs||[]).map(function(c, i){
    var nm = c.name === "__other" ? String(c.other||"").trim() : c.name; if (!nm) return "";
    var ok = c.name !== "__other" && APX.CERTS.indexOf(c.name) >= 0;
    return '<tr><td><span class="cchip'+(ok?'':' x')+'" title="'+(ok?'인정 자격증':'인정 자격증 아님')+'">'+esc(nm)+'</span></td><td>'+apxFileBtn(p, "certs."+i+".file", c.file)+'</td></tr>';
  }).filter(Boolean).join("");
  var engTxt = String(a.eng.score||"").trim() ? esc((a.eng.test==="__other"?(a.eng.other||"기타"):a.eng.test)+" "+a.eng.score)+(a.eng.date?' · 취득일 '+esc(a.eng.date):'') : '';
  var etc = '<section class="as-sec"><h5 class="as-h"><span class="as-n">7</span>자격증 · 영어 · 증명서 파일 <span class="mu sm" style="font-weight:500">파일 이름을 누르면 원본이 열립니다</span></h5>' +
    '<table class="as-ft"><thead><tr><th>항목</th><th>제출 파일</th></tr></thead><tbody>' +
    (certRows || '<tr><td>자격증</td><td class="mu">없음</td></tr>') +
    '<tr><td>영어 '+(engTxt ? '<b>'+engTxt+'</b>' : '<span class="mu">점수 없음</span>')+'</td><td>'+apxFileBtn(p, "eng.file", engTxt ? a.eng.file : "")+'</td></tr>' +
    '<tr><td>성적증명서</td><td>'+apxFileBtn(p, "transcript", a.transcript)+'</td></tr>' +
    '<tr><td>증명사진</td><td>'+apxFileBtn(p, "photo", a.photoName || (a.photo ? "증명사진" : ""))+'</td></tr>' +
    '</tbody></table></section>';
  // 8. 자기소개서 + 채점 (여기서 입력한 점수가 선발 평가표에 그대로 들어감)
  var SCW = selCfg().introW, locked = !!(sel.confirmed);
  var score = '<div class="as-score"><label for="asScore"><b>자기소개 점수</b></label>' +
    (opts.readonly ? '<b class="mono">'+(s.intro == null ? '미채점' : s.intro)+'</b> / '+selFmt(SCW)+'점'
      : '<input class="ip mono" id="asScore" type="number" min="0" max="'+SCW+'" step="0.5" inputmode="decimal" value="'+(s.intro == null ? "" : s.intro)+'" placeholder="-"'+(locked||a.status!=="SUBMITTED"?' disabled':'')+'> <span>/ '+selFmt(SCW)+'점</span>' +
        '<span class="tiny mu" id="asScoreMsg">'+(a.status!=="SUBMITTED" ? '제출된 신청서만 채점할 수 있습니다.' : locked ? '학생에게 배정을 통보한 뒤에는 바꿀 수 없습니다.' : '입력하면 선발 평가표에 바로 반영됩니다.')+'</span>' +
        '<button type="button" class="b" id="asNext" style="margin-left:auto">다음 학생 →</button>') + '</div>';
  var intro = '<section class="as-sec"><h5 class="as-h"><span class="as-n">8</span>자기소개서 · 채점 <span class="mu sm" style="font-weight:500">'+(a.intro||"").length.toLocaleString()+'자</span></h5><div class="as-intro">'+esc(a.intro||"(작성 전)")+'</div>'+score+'</section>';
  return '<div class="as-sheet">'+basic+'<div class="as-wishes">'+wishes+'</div>'+preSec+condSec+etc+intro+'</div>';
}

function goalAvg(map, list){ var v = list.map(function(c){ return Number(map[c.name]); }).filter(function(x){ return x > 0; }); return v.length ? v.reduce(function(a,b){ return a+b; }, 0) / v.length : null; }

function renderGoalDiag(host, s, ex){

    ["pre","사전 자가진단", G.preAt ? "완료 · "+fmtDT(G.preAt) : preN+" / "+N, !!G.preAt],
    ["post","사후 재평가", G.postAt ? "완료 · "+fmtDT(G.postAt) : (G.preAt ? postN+" / "+N : "사전 진단 후"), !!G.postAt],
    ["result","역량 변화", G.postAt ? "확인 가능" : "재평가 후", !!G.postAt]

function renderJournalDetail(host, s){
  var ds = UI.journalEdit || UI.journalView;
  var existing = logsOf(s.id).filter(function(l){ return l.logDate===ds; })[0];
  var editable = !!UI.journalEdit || (existing && (existing.status==="DRAFT"||existing.status==="RETURNED"));
  var back = h('<button type="button" class="btn btn-sm btn-out" style="margin-bottom:14px">← 목록/달력으로</button>');
  back.addEventListener("click", function(){ UI.journalEdit=UI.journalView=null; renderMain(); });
  host.appendChild(back);

  if (!editable){
    // 열람 전용
    var l = existing;
    if (!l){ host.appendChild(h('<div class="empty">해당 날짜에 작성된 일지가 없습니다.</div>')); return; }
    var rv = (l.reviews||[]).map(function(r){
      return '<div style="border-radius:10px;background:#F5F7F8;padding:8px 12px;font-size:13px;margin-top:8px"><div class="tiny"><b style="color:'+(r.reviewerRole==="FACULTY"?"#13212B":"#2E6B74")+'">'+(r.reviewerRole==="FACULTY"?"지도 교수":"현장 담당자")+'</b> · '+esc(r.reviewerName)+' · '+esc(ACT[r.action]||r.action)+' · '+esc(fmtDT(r.createdAt))+'</div>'+esc(r.comment)+sigBlock(r.signature)+'</div>';
    }).join("");
    host.appendChild(h(card(l.logDate+" 실습일지  "+ (LOGST[l.status]||["",""])[0], "",
      '<h3 style="font-size:15px;font-weight:800">'+esc(l.title)+'</h3><p class="tiny">'+esc(l.practiceArea)+' · '+esc(l.workHours)+'시간</p>' +
      sec("실습 내용", l.practiceContent)+sec("학습 내용", l.learningContent)+sec("소감·고찰", l.reflection) +
      ((l.photos&&l.photos.length)?'<div style="margin-top:12px"><div class="lb" style="color:#245860">첨부 사진</div>'+photoStrip(l.photos)+'</div>':'') +
      (rv?'<div style="margin-top:8px">'+rv+'</div>':'<p class="notice" style="margin-top:10px">아직 피드백이 없습니다.</p>'))));
    function sec(t,x){ return '<div style="margin-top:12px"><div class="lb" style="color:#245860">'+esc(t)+'</div><div style="white-space:pre-wrap;font-size:13px;color:#2F3A44">'+esc(x)+'</div></div>'; }
    return;
  }
  // 작성/수정 폼
  var d = existing ? { title:existing.title, area:existing.practiceArea, hrs:existing.workHours, pc:existing.practiceContent, lc:existing.learningContent, rf:existing.reflection, photos:(existing.photos||[]).slice() }
                   : { title:"", area:s.area, hrs:8, pc:"", lc:"", rf:"", photos:[] };
  UI.jdraft = UI.jdraft || d;
  var jd = UI.jdraft;
  var form = h(card((existing?"실습일지 수정":"실습일지 작성")+" — "+ds, existing?badge(LOGST,existing.status):"신규",
    '<form onsubmit="return false" class="grid" style="gap:14px">' +
      '<div class="fldrow c3">' +
        '<label class="lb">실습 영역<select class="cell" id="jArea" style="max-width:none">'+PRACTICE_AREAS.map(function(a){return '<option'+(a===jd.area?' selected':'')+'>'+a+'</option>';}).join("")+'</select></label>' +
        '<label class="lb">실습 시간<input class="cell" id="jHrs" type="number" min="0" max="24" step="0.5" value="'+esc(jd.hrs)+'" style="width:100%"></label>' +
        '<label class="lb">일자<input class="cell" id="jDate" type="date" value="'+esc(ds)+'" style="width:100%" disabled></label>' +
      '</div>' +
      '<label class="lb">제목<input class="cell" id="jTitle" value="'+esc(jd.title)+'" placeholder="예: 전자의무기록(EMR) 코딩 실습" style="width:100%"></label>' +
      '<label class="lb">실습 내용 (수행 업무)<textarea class="in" id="jPc" rows="4">'+esc(jd.pc)+'</textarea></label>' +
      '<label class="lb">학습 내용 (이론·지식)<textarea class="in" id="jLc" rows="4">'+esc(jd.lc)+'</textarea></label>' +
      '<label class="lb">소감·고찰<textarea class="in" id="jRf" rows="3">'+esc(jd.rf)+'</textarea></label>' +
      '<div><div class="lb">사진 첨부 <span class="tiny" style="font-weight:400">(실습 현장·산출물 사진 — 개인정보·환자정보가 보이지 않게 주의)</span></div>'+photoBtn("jPhotoIn")+'<div id="jPhotos">'+photoStrip(jd.photos,"data-jpdel")+'</div></div>' +
      '<p class="err" id="jErr" hidden></p>' +
      '<div class="btnrow"><button type="button" class="btn btn-out" id="jSave">임시저장</button><button type="button" class="btn btn-grad" id="jSubmit">제출하기</button></div>' +
    '</form>'));
  host.appendChild(form);
  function grab(){ return { title:$("jTitle").value.trim(), area:$("jArea").value, hrs:Number($("jHrs").value), pc:$("jPc").value.trim(), lc:$("jLc").value.trim(), rf:$("jRf").value.trim(), photos:(UI.jdraft&&UI.jdraft.photos)||[] }; }
  ["jTitle","jArea","jHrs","jPc","jLc","jRf"].forEach(function(id){ var e=$(id); if(e) e.addEventListener("input", function(){ UI.jdraft = grab(); }); });
  $("jPhotoIn").addEventListener("change", function(){
    var fs = this.files; var keep = grab();
    readPhotos(fs, function(ph){ keep.photos = (keep.photos||[]).concat(ph); UI.jdraft = keep; renderMain(); toast(ph.length+"장의 사진을 첨부했습니다."); });
  });
  $("jPhotos").querySelectorAll("[data-jpdel]").forEach(function(b){ b.addEventListener("click", function(){ var k=grab(); k.photos.splice(Number(this.getAttribute("data-jpdel")),1); UI.jdraft=k; renderMain(); }); });
  function persist(status){
    var g = grab();
    if (status==="SUBMITTED"){
      if(!g.title){ return ferr("제목을 입력하세요."); }
      if(g.pc.length<10){ return ferr("실습 내용을 10자 이상 입력하세요."); }
      if(g.rf.length<10){ return ferr("소감을 10자 이상 입력하세요."); }
    }
    var rec = existing;
    if (!rec){ rec = log(s.id, ds, g.title, g.area, g.hrs, g.pc, g.lc, g.rf, "DRAFT", []); DB.logs.push(rec); }
    rec.title=g.title; rec.practiceArea=g.area; rec.workHours=g.hrs; rec.practiceContent=g.pc; rec.learningContent=g.lc; rec.reflection=g.rf; rec.photos=g.photos||[];
    rec.status = status; rec.submittedAt = status==="DRAFT"? null : new Date().toISOString();
    UI.jdraft = null; UI.journalEdit = null; UI.journalView = null;
    renderMain(); toast(status==="DRAFT"?"임시저장되었습니다.":"실습일지가 제출되었습니다.");
  }
  function ferr(m){ $("jErr").textContent=m; $("jErr").hidden=false; }
  $("jSave").addEventListener("click", function(){ persist("DRAFT"); });
  $("jSubmit").addEventListener("click", function(){ persist("SUBMITTED"); });
}
RENDER.STUDENT.attend = function(){
  var s = studentById(SESSION.studentId) || DB.students[0];
  var list = attOf(s.id).slice().sort(function(a,b){ return b.workDate.localeCompare(a.workDate); });
  var a = attSummary(attOf(s.id));
  // 선택 날짜 (기본 오늘, 실습기간 내로 제한)
  var dmax = (TODAY < s.end) ? TODAY : s.end;
  if (!UI.attDate || UI.attDate < s.start || UI.attDate > dmax) UI.attDate = dmax;
  var ds = UI.attDate;
  var rec = list.filter(function(r){ return r.workDate===ds; })[0];
  var isToday = ds === TODAY;
  var dow = ["일","월","화","수","목","금","토"][new Date(ds+"T00:00:00+09:00").getDay()];

  pageShell("출결", "출석률 "+a.rate+"% · 출석 "+a.done+"일 / 필수 "+reqOf(s).days+"일 ("+reqOf(s).label+")", "");
  var host = pbody();
  var top = h(card("출퇴근 기록", "",
    '<label class="lb">날짜 선택 <span class="tiny">(실습기간 '+esc(s.start)+' ~ '+esc(dmax)+' 내)</span>' +
      '<input class="cell" id="attDate" type="date" value="'+esc(ds)+'" min="'+esc(s.start)+'" max="'+esc(dmax)+'" style="width:180px"></label>' +
    '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px">' +
      '<div style="font-size:13px;font-weight:800">'+esc(ds)+' ('+dow+')'+(isToday?' <span class="badge b-blue">오늘</span>':'')+'</div>' +
      '<div style="width:1px;height:32px;background:#E3E7EA"></div>' +
      '<div style="text-align:center"><div class="tiny">출근</div><div style="font-size:18px;font-weight:800">'+fmtTime(rec&&rec.checkInAt)+'</div></div>' +
      '<div style="text-align:center"><div class="tiny">퇴근</div><div style="font-size:18px;font-weight:800">'+fmtTime(rec&&rec.checkOutAt)+'</div></div>' +
      '<div>'+(rec? badge(ATT,rec.status)+' '+badge(APR,rec.approvalStatus) : '<span class="tiny">기록 없음</span>')+'</div>' +
      '<div class="sp" style="flex:1"></div>' +
      '<button type="button" class="btn btn-teal" id="ciBtn"'+((rec&&rec.checkInAt)?' disabled':'')+'>'+(isToday?'출근하기':'출근 기록')+'</button>' +
      '<button type="button" class="btn btn-out" id="coBtn"'+((!rec||!rec.checkInAt||rec.checkOutAt)?' disabled':'')+'>'+(isToday?'퇴근하기':'퇴근 기록')+'</button>' +
    '</div>' +
    (isToday ? '' : '<p class="tiny" style="margin-top:8px">지난 날짜의 출퇴근을 사후 기록합니다. 기록 시 표준 시각(09:00 / 18:00)으로 저장되며 현장 책임자 승인 대상입니다.</p>')));
  host.appendChild(top);
  $("attDate").addEventListener("change", function(){
    var v = this.value; if (!v) return;
    if (v < s.start) v = s.start; if (v > dmax) v = dmax;
    UI.attDate = v; renderMain();
  });
  function stdISO(d, t){ return new Date(d+"T"+t+":00+09:00").toISOString(); }
  $("ciBtn").addEventListener("click", function(){
    var ci, st;
    if (isToday){ var now=new Date(); ci=now.toISOString(); st=(now.getHours()>9||(now.getHours()===9&&now.getMinutes()>0))?"LATE":"PRESENT"; }
    else { ci=stdISO(ds,"09:00"); st="PRESENT"; }
    if (rec){ rec.checkInAt=ci; rec.status=st; rec.approvalStatus="PENDING"; }
    else { var r=att(s.id, ds, null, null, st, "PENDING"); r.checkInAt=ci; DB.attendance.push(r); }
    renderMain(); toast((isToday?"출근이":"출근이 사후")+" 기록되었습니다. 승인 대기 중입니다.");
  });
  $("coBtn").addEventListener("click", function(){
    var co = isToday ? new Date().toISOString() : stdISO(ds,"18:00");
    rec.checkOutAt = co;
    rec.workMinutes = Math.max(0, Math.round((new Date(co) - new Date(rec.checkInAt))/60000));
    renderMain(); toast("퇴근이 기록되었습니다.");
  });
  var rows = list.slice(0,15).map(function(r){
    return '<tr'+(r.workDate===ds?' class="hl"':'')+'><td><button type="button" class="btn btn-sm btn-out" data-attd="'+r.workDate+'">'+esc(r.workDate.slice(5))+'</button></td><td class="num">'+fmtTime(r.checkInAt)+'</td><td class="num">'+fmtTime(r.checkOutAt)+'</td><td class="mut">'+esc(fmtDur(r.workMinutes))+'</td><td>'+badge(ATT,r.status)+'</td><td>'+badge(APR,r.approvalStatus)+'</td></tr>';
  }).join("");
  var hc = h(card("출결 이력","일자를 누르면 위에서 편집", tbl(["일자","출근","퇴근","근무시간","상태","승인"], rows)));
  host.appendChild(hc);
  hc.querySelectorAll("[data-attd]").forEach(function(b){ b.addEventListener("click", function(){ UI.attDate=this.getAttribute("data-attd"); renderMain(); }); });
};

/* 만족도 조사 공용 폼 (학생용 · 기관용) — 5점 리커트(매우 그렇다 → 전혀 그렇지 않다) */
var LIKERT_LABELS = ["전혀 그렇지 않다","그렇지 않다","보통이다","그렇다","매우 그렇다"];
function surveySections(items){
  var secs = [], byId = {};
  (items || DB.surveyItems).forEach(function(q){
    var key = q.section || "기타";
    if (!byId[key]){ byId[key] = { title:key, items:[] }; secs.push(byId[key]); }
    byId[key].items.push(q);
  });
  return secs;
}
function surveyScaleIds(items){ return (items || DB.surveyItems).filter(function(q){ return q.type==="scale"; }).map(function(q){ return q.id; }); }
function renderSurveyForm(host, cfg){
  var st = UI[cfg.key] = UI[cfg.key] || { edit:false, ans: cfg.mine ? clone(cfg.mine.answers) : {} };
  var editing = !cfg.mine || st.edit;
  var reqIds = surveyScaleIds(cfg.items);
  var answered = reqIds.filter(function(id){ return Number(st.ans[id]) > 0; }).length;
  var vals = reqIds.map(function(id){ return Number(st.ans[id]); }).filter(function(v){ return v>0; });
  var avg = vals.length ? Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*100)/100 : null;
  if (cfg.head) host.appendChild(h(cfg.head));
  if (cfg.mine && !editing) host.appendChild(h('<div class="notice" style="background:#F0F7F8;color:#245860;margin-bottom:14px">제출이 완료되었습니다. '+esc(cfg.doneNote||"")+(avg!=null?' <b style="float:right">척도 평균 '+avg+' / 5</b>':'')+'</div>'));
  surveySections(cfg.items).forEach(function(sec){
    var rows = sec.items.map(function(q){
      var cur = Number(st.ans[q.id]) || 0;
      if (q.type==="text"){
        var tv = st.ans[q.id] || "";
        return '<div style="padding:11px 0;border-top:1px solid #F3F4F6"><label class="lb" style="font-weight:500">'+esc(q.text)+'</label>' +
          (editing ? '<textarea class="in" data-q="'+q.id+'" rows="3">'+esc(tv)+'</textarea>'
                   : '<p style="background:#F5F7F8;border-radius:8px;padding:7px 10px;font-size:13px;color:#6B7680;white-space:pre-wrap">'+esc(String(tv).trim()||"(응답 없음)")+'</p>') + '</div>';
      }
      return '<div style="padding:11px 0;border-top:1px solid #F3F4F6"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:13px;font-weight:500">'+esc(q.text)+' <span style="color:#E0806F">*</span></span>'+(cur?'<span class="tiny" style="font-weight:800;color:#245860;white-space:nowrap">'+cur+' · '+esc(LIKERT_LABELS[cur-1])+'</span>':'')+'</div>' +
        '<div class="scale">'+[5,4,3,2,1].map(function(n){ return '<button type="button" data-q="'+q.id+'" data-n="'+n+'" class="'+(cur===n?"on":"")+'" '+(editing?"":"disabled")+'><span class="n">'+n+'</span>'+esc(LIKERT_LABELS[n-1])+'</button>'; }).join("")+'</div></div>';
    }).join("");
    host.appendChild(h(card(sec.title, "", rows)));
  });
  if (cfg.mine && !editing){
    host.appendChild(h('<div class="btnrow"><button type="button" class="btn btn-out" id="svEditBtn">응답 수정</button></div>'));
    $("svEditBtn").addEventListener("click", function(){ st.edit = true; renderMain(); });
    return;
  }
  host.appendChild(h('<div class="card"><div class="card-bd" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="tiny">필수 응답 <b style="color:#245860">'+answered+'</b> / '+reqIds.length+'</span><p class="err" id="svErr" hidden style="margin:0"></p><span style="flex:1"></span>'+(cfg.mine?'<button type="button" class="btn btn-sm btn-out" id="svCancel">취소</button>':'')+'<button type="button" class="btn btn-grad" id="svSubmit">'+(cfg.mine?"수정 제출":"제출하기")+'</button></div></div>'));
  host.querySelectorAll("[data-q][data-n]").forEach(function(b){ b.addEventListener("click", function(){ st.ans[this.getAttribute("data-q")] = Number(this.getAttribute("data-n")); renderMain(); }); });
  host.querySelectorAll("textarea[data-q]").forEach(function(t){ t.addEventListener("input", function(){ st.ans[this.getAttribute("data-q")] = this.value; }); });
  var cn = $("svCancel"); if (cn) cn.addEventListener("click", function(){ st.edit=false; st.ans = cfg.mine ? clone(cfg.mine.answers) : {}; renderMain(); });
  $("svSubmit").addEventListener("click", function(){
    var miss = reqIds.filter(function(id){ return !(Number(st.ans[id])>0); });
    if (miss.length){ $("svErr").textContent = "척도 문항 "+miss.length+"개에 응답해 주세요."; $("svErr").hidden=false; return; }
    cfg.onSubmit(clone(st.ans)); st.edit=false; renderMain(); toast("만족도 조사가 제출되었습니다.");
  });
}

RENDER.FACULTY.home = function(){
  var list = studentsForFaculty(SESSION.id);
  var byInst = {}; list.forEach(function(s){ (byInst[s.institutionId]=byInst[s.institutionId]||[]).push(s); });
  var attWarn = [], logWarn = [];
  var peerDone = 0, peerSub = 0;
  list.forEach(function(s){ peerDone = Math.max(peerDone, attSummary(attOf(s.id)).done); peerSub = Math.max(peerSub, logStat(s.id).submitted); });
  list.forEach(function(s){
    var a = attSummary(attOf(s.id)), lg = logStat(s.id);
    var whyA = [];
    if (a.ABSENT > 0) whyA.push("결석 "+a.ABSENT);
    if (a.LATE >= 2) whyA.push("지각 "+a.LATE);
    if (a.pending > 0) whyA.push("출결 미승인 "+a.pending);
    if (peerDone - a.done >= 2) whyA.push("출석 누계 부족("+a.done+"/"+peerDone+"일)");
    if (whyA.length) attWarn.push({ s:s, why:whyA.join(" · ") });
    var whyL = [];
    if (lg.returned > 0) whyL.push("보완요청 "+lg.returned);
    if (lg.pendingField >= 2) whyL.push("현장 결재 대기 "+lg.pendingField);
    if (peerSub - lg.submitted >= 2) whyL.push("일지 미작성("+lg.submitted+"/"+peerSub+"건)");
    if (whyL.length) logWarn.push({ s:s, why:whyL.join(" · ") });
  });
  pageShell("홈", SESSION.name + " · 담당 학생 " + list.length + "명 · 실습기관 " + Object.keys(byInst).length + "곳", "");
  var host = pbody();
  host.appendChild(h('<div class="grid stats">' +
    '<div class="stat"><div class="k">담당 학생</div><div class="v">'+list.length+'명</div></div>' +
    '<div class="stat"><div class="k">파견 실습기관</div><div class="v">'+Object.keys(byInst).length+'곳</div></div>' +
    '<div class="stat'+(attWarn.length?' warn':'')+'"><div class="k">출결 주의</div><div class="v">'+attWarn.length+'명</div></div>' +
    '<div class="stat'+(logWarn.length?' warn':'')+'"><div class="k">실습일지 주의</div><div class="v">'+logWarn.length+'명</div></div>' +
    '</div>'));
  // 기관별 인원
  var irows = Object.keys(byInst).map(function(iid){
    var g = byInst[iid];
    var avgAtt = Math.round(g.reduce(function(t,s){ return t+pct(attSummary(attOf(s.id)).done, reqOf(s).days); },0)/g.length);
    var avgLog = Math.round(g.reduce(function(t,s){ return t+pct(logStat(s.id).submitted, reqOf(s).logs); },0)/g.length);
    return '<tr><td>'+esc(instName(iid))+'</td><td class="num">'+g.length+'명</td><td class="num">'+avgAtt+'%</td><td class="num">'+avgLog+'%</td><td class="tiny mut">'+esc(g.map(function(s){return s.name;}).join(", "))+'</td></tr>';
  }).join("");
  host.appendChild(h(card("실습기관별 파견 현황", list.length+"명", tbl(["실습기관","인원","평균 출석률","평균 일지 제출율","학생"], irows))));
  // 주의 대상
  function warnCard(title, arr, kind){
    if (!arr.length) return card(title, "0명", '<div class="empty" style="padding:20px 0">해당 없음 — 모두 정상 범위입니다.</div>');
    return card(title, arr.length+"명", '<div class="pick">' + arr.map(function(w){
      return '<button type="button" data-warn="'+w.s.id+'"><div class="top"><span class="nm">'+esc(w.s.name)+' <span class="no">'+esc(w.s.no)+'</span></span><span class="badge '+(kind==="att"?"b-rose":"b-amber")+'">주의</span></div><div class="mt">'+esc(instName(w.s.institutionId))+' · '+esc(w.why)+'</div></button>';
    }).join("") + '</div>');
  }
  var wc1 = h(warnCard("출결 주의 대상", attWarn, "att")); host.appendChild(wc1);
  var wc2 = h(warnCard("실습일지 주의 대상", logWarn, "log")); host.appendChild(wc2);
  host.querySelectorAll("[data-warn]").forEach(function(b){ b.addEventListener("click", function(){ UI.reviewSid=this.getAttribute("data-warn"); UI.reviewDate=null; navTo("review"); }); });
};

RENDER.FACULTY.stats = function(){
  var list = studentsForFaculty(SESSION.id);
  var attSum=0,logSum=0,risk=0;
  list.forEach(function(s){ var rq=reqOf(s), a=attSummary(attOf(s.id)); attSum+=pct(a.done,rq.days); logSum+=pct(logStat(s.id).submitted,rq.logs); if(pct(a.done,rq.days)<30||pct(logStat(s.id).submitted,rq.logs)<30||a.ABSENT>0) risk++; });
  var n=list.length||1;
  var rows = list.map(function(s){
    var rq=reqOf(s), a=attSummary(attOf(s.id)), lg=logStat(s.id);
    var ar=pct(a.done,rq.days), lr=pct(lg.submitted,rq.logs);
    return '<tr'+((a.ABSENT>0)?' class="hl"':'')+'><td>'+esc(s.name)+'<div class="tiny">'+esc(s.no)+'</div></td><td class="mut">'+esc(instName(s.institutionId))+'</td><td class="tiny">'+esc(rq.label)+'</td>' +
      '<td class="num">'+a.done+' / '+rq.days+' ('+ar+'%)</td><td class="num">지각 '+a.LATE+' · 결석 '+a.ABSENT+'</td>' +
      '<td class="num">'+lg.submitted+' / '+rq.logs+' ('+lr+'%)</td><td class="num">'+lg.approved+'건</td></tr>';
  }).join("");
  pageShell("출결 · 제출율 통계", "행정팀은 열람하지 않으며 지도교수 화면에서만 관리합니다. (필수 일수는 학번별 기준: 2025학번↓ 3주 120시간 / 2026학번↑ 4주 160시간)", "");
  var host = pbody();
  host.appendChild(h('<div class="toolbar"><button type="button" class="btn btn-sm btn-out" id="csvStats">CSV 다운로드</button></div>'));
  host.appendChild(h('<div class="sumline">'+sumchip("평균 출석 진행률",Math.round(attSum/n)+"%")+sumchip("평균 일지 제출 진행률",Math.round(logSum/n)+"%")+sumchip("관리 필요",risk+"명")+'</div>'));
  host.appendChild(h(tbl(["학생","실습기관","실습 기준","출석(일수/필수)","지각·결석","일지 제출","승인 완료"], rows)));
  $("csvStats").addEventListener("click", function(){
    var out=[["학번","성명","실습기관","실습영역","실습기준","출석일수","필수일수","출석진행률(%)","지각","결석","일지제출","필수일지","승인완료"]];
    list.forEach(function(s){ var rq=reqOf(s), a=attSummary(attOf(s.id)), lg=logStat(s.id); out.push([s.no,s.name,instName(s.institutionId),s.area,rq.label,a.done,rq.days,pct(a.done,rq.days),a.LATE,a.ABSENT,lg.submitted,rq.logs,lg.approved]); });
    downloadCSV("실습_출결_제출율.csv", out); toast("CSV를 내려받았습니다.");
  });
};

  setCard.querySelectorAll("[data-ad]").forEach(function(i){ i.addEventListener("change", function(){ var a=G.areas.filter(function(x){return x.id===this.getAttribute("data-ad");}.bind(this))[0]; a.desc=this.value; }); });
  setCard.querySelectorAll("[data-adel]").forEach(function(b){ b.addEventListener("click", function(){ var id=this.getAttribute("data-adel"); G.areas=G.areas.filter(function(x){return x.id!==id;}); Object.keys(G.scores).forEach(function(k){ delete G.scores[k][id]; }); renderMain(); }); });

  }).join("");

    tbl(["학생"].concat(G.areas.map(function(a){ return a.name+" ("+a.max+")"; })).concat(["합계 / 100","학점"]), srows) +
    '<div class="btnrow" style="justify-content:flex-start"><button type="button" class="btn btn-sm btn-out" id="gOrg">기관 평가표 점수 → "기관" 영역에 반영</button><span class="tiny">기관(책임자) 평가표 합계(100점)를 해당 영역 배점으로 환산해 채웁니다. 이후 직접 수정 가능.</span></div>'));

      var v=this.value===""?"":Math.max(0,Math.min(Number(a.max)||0,Number(this.value)));
      if(v!==""&&String(v)!==this.value) this.value=v;

  });

  });

};

/* 큰 사진(4MB 초과 또는 긴 변 3000px 초과)은 긴 변 2560px JPEG로 줄여서 올림 — 휴대폰 고화질 사진 대비 */
function pfShrinkPhoto(f){
  return new Promise(function(ok){
    if (f.size <= 4*1024*1024 && f.type === "image/png") return ok(f);
    var url = URL.createObjectURL(f), im = new Image();

      URL.revokeObjectURL(url);

        (it.err ? '<div class="pph-err">'+esc(it.err)+'</div>' : '<input class="cell" data-pdesc="'+i+'" placeholder="'+K.name+' 설명 (선택)" maxlength="300" value="'+esc(it.desc||"")+'">') +

    }).join("") + '</div>' : '';
    var okN = pend.filter(function(x){ return !x.err; }).length, ub = $(P+"Up");
    if (ub){ ub.disabled = !okN || PF.busy[kind]; ub.textContent = okN ? K.name+" 업로드 ("+okN+"개)" : K.name+" 업로드"; }

    el.querySelectorAll("[data-pdesc]").forEach(function(inp){ inp.addEventListener("input", function(){ pend[+this.getAttribute("data-pdesc")].desc = this.value; }); });
  }
  async function addFiles(files){
    files = Array.prototype.slice.call(files || []);
    var pend = PF.pending[kind];
    if (pend.length + files.length > K.maxN){ msg([{ t:"한 번에 "+K.maxN+"개까지 올릴 수 있습니다." }]); files = files.slice(0, Math.max(0, K.maxN - pend.length)); }
    for (var i = 0; i < files.length; i++){
      var f = files[i], err = await pfCheck(kind, f);
      var it = { file:f, err:err, desc:"", preview:"" };
      if (!err && kind === "PHOTO") it.preview = await new Promise(function(ok){ var r = new FileReader(); r.onload = function(){ ok(r.result); }; r.onerror = function(){ ok(""); }; r.readAsDataURL(f); });
      pend.push(it);
    }
    var bad = pend.filter(function(x){ return x.err; });
    msg(bad.map(function(x){ return { t:x.file.name+": "+x.err+" (업로드에서 제외)" }; }));
    drawPending();
  }
  async function drawList(force){
    var g = $(P+"List"); if (!g) return;
    try {
      var list = await pfList(kind, eduId, force);
      g = $(P+"List"); if (!g) return;
      $(P+"Cnt").textContent = list.length + (kind === "PHOTO" ? "장" : "개");
      if (!list.length) g.innerHTML = '<p class="tiny" style="grid-column:1/-1">아직 올린 '+(kind === "PHOTO" ? "사진이" : "자료가")+' 없습니다.</p>';
      else if (kind === "PHOTO") g.innerHTML = list.map(function(x){
        return '<figure class="pph-it"><a href="'+esc(x.url||"#")+'" target="_blank" rel="noopener" title="원본 보기">'+(x.url?'<img src="'+esc(x.url)+'" alt="'+esc(x.description||x.file_name)+'" loading="lazy">':'<div class="pph-noimg">이미지 없음</div>')+'</a>' +
          '<figcaption><div class="pph-fn" title="'+esc(x.file_name)+'">'+esc(x.file_name)+'</div>' + (x.description ? '<div class="pph-desc">'+esc(x.description)+'</div>' : '') +
          '<div class="tiny">'+pfFmt(x.file_size)+' · '+esc(x.uploaded_by_name||"")+' · '+esc(fmtDT(x.uploaded_at))+'</div>' +
          (canEdit ? '<button type="button" class="btn btn-sm btn-danger" data-pdel="'+esc(x.id)+'" style="margin-top:6px">삭제</button>' : '') + '</figcaption></figure>';
      }).join("");
      else g.innerHTML = list.map(function(x){
        return '<div class="pfm-row"><span class="pfm-ic">'+esc(PF_IC[pfExt(x.file_name)]||"FILE")+'</span><div class="pfm-main"><a href="'+esc(x.url||"#")+'" target="_blank" rel="noopener" download="'+esc(x.file_name)+'"><b>'+esc(x.file_name)+'</b></a>' +
          (x.description ? '<div class="pph-desc">'+esc(x.description)+'</div>' : '') + '<div class="tiny">'+pfFmt(x.file_size)+' · '+esc(x.uploaded_by_name||"")+' · '+esc(fmtDT(x.uploaded_at))+'</div></div>' +
          (canEdit ? '<button type="button" class="btn btn-sm btn-danger" data-pdel="'+esc(x.id)+'">삭제</button>' : '') + '</div>';
      }).join("");
      g.querySelectorAll("[data-pdel]").forEach(function(b){ b.addEventListener("click", async function(){
        var x = list.filter(function(y){ return String(y.id) === b.getAttribute("data-pdel"); })[0]; if (!x) return;
        if (!window.confirm("이 "+(kind === "PHOTO" ? "사진을" : "자료를")+" 삭제할까요?\n" + x.file_name + "\n삭제하면 되돌릴 수 없습니다.")) return;
        b.disabled = true;
        try { await pfDelete(kind, eduId, x); msg([{ t:x.file_name+" 삭제했습니다.", ok:true }]); drawList(true); }
        catch (e){ b.disabled = false; msg([{ t:"삭제하지 못했습니다: "+pfErr(e) }]); }
      }); });
    } catch (e){ g.innerHTML = '<p class="msg">목록을 불러오지 못했습니다: '+esc(pfErr(e))+'</p>'; }
  }
  if (canEdit){
    $(P+"In").addEventListener("change", function(){ addFiles(this.files); this.value = ""; });
    var dz = $(P+"Drop");
    ["dragenter","dragover"].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add("on"); }); });
    ["dragleave","drop"].forEach(function(ev){ dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("on"); }); });
    dz.addEventListener("drop", function(e){ addFiles(e.dataTransfer && e.dataTransfer.files); });
    $(P+"Up").addEventListener("click", async function(){
      var pend = PF.pending[kind], items = pend.filter(function(x){ return !x.err; }); if (!items.length || PF.busy[kind]) return;
      PF.busy[kind] = true; this.disabled = true;
      var pg = $(P+"Prog"), bar = pg.querySelector("i"), lab = pg.querySelector("span"); pg.hidden = false;
      var res = [];
      for (var i = 0; i < items.length; i++){
        lab.textContent = "업로드 중 " + (i+1) + " / " + items.length + " · " + items[i].file.name;
        bar.style.width = (i / items.length * 100) + "%";
        try { await pfUpload(kind, eduId, items[i]); items[i].done = true; res.push({ t:items[i].file.name+" 업로드 완료", ok:true }); }
        catch (e){ res.push({ t:items[i].file.name+" 업로드 실패: "+pfErr(e) }); }

      PF.pending[kind] = pend.filter(function(x){ return !x.done && !x.err; });
      PF.busy[kind] = false;
      var okN = res.filter(function(x){ return x.ok; }).length;
      res.unshift({ t: okN + "개 업로드 성공" + (res.length - okN ? ", " + (res.length - okN) + "개 실패" : ""), ok: okN === res.length });
      msg(res);
      setTimeout(function(){ var p = $(P+"Prog"); if (p) p.hidden = true; }, 1200);
      drawPending(); delete PF.cache[kind + "|" + eduId]; drawList(true);
    });
    drawPending();
  }
  $(P+"Re").addEventListener("click", function(){ drawList(true); });
  drawList(false);
}

/* ---------- 사전교육 운영 보고서 (PDF) ---------- */
function toDataURL(url){
  if (!url || /^data:/.test(url)) return Promise.resolve(url || "");
  return fetch(url).then(function(r){ if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(function(b){ return new Promise(function(ok){ var fr = new FileReader(); fr.onload = function(){ ok(fr.result); }; fr.onerror = function(){ ok(""); }; fr.readAsDataURL(b); }); })
    .catch(function(){ return ""; });
}
/* 보고서 내용 — forPdf 이면 사진을 파일 안에 넣고 자료 링크를 7일짜리로 만듦 */
async function prepReportHTML(ps, forPdf){
  var photos = await pfList("PHOTO", ps.id, true), mats = await pfList("MATERIAL", ps.id, true);
  if (forPdf){
    for (var i = 0; i < photos.length; i++) photos[i] = Object.assign({}, photos[i], { data: await toDataURL(photos[i].url) });
    if (REAL && mats.length){
      var u = await SB.storage.from(PF.MATERIAL.bucket).createSignedUrls(mats.map(function(x){ return x.storage_path; }), 7*24*3600);
      var map = {}; ((u && u.data) || []).forEach(function(x){ map[x.path] = x.signedUrl; });
      mats = mats.map(function(x){ return Object.assign({}, x, { url: map[x.storage_path] || x.url }); });
    }
  }
  var att = DB.students.filter(function(s){ return ps.attendees[s.id]; });
  var row = function(k, v){ return '<tr><th>'+k+'</th><td>'+v+'</td></tr>'; };
  return '<div class="rp">' +
    '<div class="rp-hd"><div class="rp-k">현장실습 준비교육(사전교육) 운영 보고서</div><h1>'+esc(ps.title||"사전교육")+'</h1><div class="rp-s">'+esc(DB.term.name||"")+' · 인증 6.2.1 다) 현장실습 준비교육 운영실적</div></div>' +
    '<h2>1. 운영 개요</h2><table class="rp-t">' +
      row("언제", esc(prepWhen(ps)) + (ps.hours ? ' (' + esc(ps.hours) + '시간)' : '')) +
      row("어디서", esc(ps.place||"-")) +
      row("누가 (강사)", esc(ps.lecturer||"-")) +
      row("참석 학생", att.length + '명') +
      row("작성", esc(ps.savedBy||"") + (ps.savedAt ? ' · ' + esc(new Date(ps.savedAt).toLocaleString("ko-KR")) : '')) +
    '</table>' +
    '<h2>2. 교육 내용</h2><div class="rp-box">'+(esc(ps.content||"-").replace(/\n/g, "<br>"))+'</div>' +
    '<h2>3. 제공 자료</h2>' + (ps.materials ? '<p class="rp-p">'+esc(ps.materials)+'</p>' : '') +
      (mats.length ? '<table class="rp-t rp-l"><thead><tr><th>파일</th><th>설명</th><th>크기</th><th>올린 사람</th></tr></thead><tbody>' + mats.map(function(x){
        return '<tr><td>'+(x.url && forPdf ? '<a href="'+esc(x.url)+'">'+esc(x.file_name)+'</a>' : esc(x.file_name))+'</td><td>'+esc(x.description||"")+'</td><td>'+pfFmt(x.file_size)+'</td><td>'+esc(x.uploaded_by_name||"")+'</td></tr>'; }).join("") + '</tbody></table>' +
        (forPdf && REAL ? '<p class="rp-n">파일 이름을 누르면 자료를 내려받을 수 있습니다 (링크는 보고서를 만든 뒤 7일 동안 유효).</p>' : '')
      : '<p class="rp-n">올린 자료 파일이 없습니다.</p>') +
    '<h2>4. 참석 학생 ('+att.length+'명)</h2>' + (att.length ? '<table class="rp-t rp-l"><thead><tr><th>번호</th><th>학번</th><th>이름</th></tr></thead><tbody>' +
      att.map(function(s, i){ return '<tr><td>'+(i+1)+'</td><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td></tr>'; }).join("") + '</tbody></table>' : '<p class="rp-n">참석 확인된 학생이 없습니다.</p>') +

      var src = forPdf ? x.data : x.url;

function prepReportModal(ps){

}

/* ================= 만족도 조사 (교수·행정 공용) — 학생용 / 기관용(책임자) ================= */
function surveyScreen(who){
  UI.svTab = UI.svTab || "student";
  var isInst = UI.svTab === "inst";
  var items = isInst ? DB.instSurveyItems : DB.surveyItems;
  var resp = DB.surveyResponses.filter(function(r){ return r.respondent === (isInst ? "INSTITUTION" : "STUDENT"); });
  pageShell("만족도 조사", "지도교수·학교 행정이 함께 관리합니다. ("+who+" 화면) · 학생용 5개 주제 / 기관용(현장실습 교육 책임자 → 학교) 3개 주제", "");
  var host = pbody();
  host.appendChild(tabsBar([["student","학생용 (실습기관·발전방향·사전교육/순회지도·만족도·개선사항)"],["inst","기관용 (프로그램 적절성·참여학생 평가·대학 지원)"]], UI.svTab, function(t){ UI.svTab=t; renderMain(); }));
  if (isInst) host.appendChild(h('<div class="notice" style="margin-bottom:14px">기관(현장실습 교육 책임자)의 학교 만족도 조사 결과입니다. <b>인증보고서 6.1.2 회의록</b>에 기재할 근거 자료로 활용합니다.</div>'));
  function avgOf(q){ var vals = resp.map(function(r){ return Number(r.answers[q.id]); }).filter(function(v){ return isFinite(v)&&v>0; }); return { avg: vals.length? vals.reduce(function(a,b){return a+b;},0)/vals.length : null, n: vals.length }; }
  var respondents = isInst ? DB.institutions.length : DB.students.length;
  host.appendChild(h('<div class="toolbar"><button type="button" class="btn btn-sm btn-out" id="svCsv">집계 CSV</button><button type="button" class="btn btn-sm btn-out" id="svPrn">인쇄 / PDF</button></div>'));
  host.appendChild(h('<div class="sumline">'+sumchip(isInst?"응답 기관":"응답 학생", resp.length+"곳/명")+sumchip("전체 대상", respondents+(isInst?"곳":"명"))+'</div>'));
  // 주제별 평균 + 문항별 평균
  var secs = surveySections(items), secRows = "", itemRows = "";
  secs.forEach(function(sec){
    var qs = sec.items.filter(function(q){ return q.type==="scale"; });
    if (!qs.length) return;

        panel.innerHTML=""; renderMain(); toast("전자서명과 함께 승인했습니다.");

        var t=$("rjTxt").value.trim(); if(!t){ toast("반려 사유를 입력하세요."); return; }

      });

  });
};

/* 실습생 평가표 (기관 → 학교) — 영역·항목·배점은 기관이 세팅(융통성), 합계는 100점으로 환산 */
function fieldEvalScreen(list){
  pageShell("실습생 평가표 (기관 → 학교)", "실습 종료 후 현장실습 교육 책임자가 실습생 평가표를 작성·제출합니다. 평가 영역·항목·배점은 기관 실정에 맞게 직접 세팅할 수 있습니다. (전자서명 필요)", "");
  var host = pbody();
  if (!list.length){ host.appendChild(h('<div class="empty">담당 실습생이 없습니다.</div>')); return; }
  UI.feSid = UI.feSid && list.filter(function(s){return s.id===UI.feSid;}).length ? UI.feSid : list[0].id;
  var iid = SESSION.institutionId || studentById(UI.feSid).institutionId;
  function itemsNow(){ return evalItemsFor(iid); }
  function ensureOwn(){ if (!(DB.evalItemsInst[iid] && DB.evalItemsInst[iid].length)) DB.evalItemsInst[iid] = clone(DB.evalItems.FIELD); return DB.evalItemsInst[iid]; }
  var items = itemsNow();
  host.appendChild(h('<div class="toolbar"><label class="lb" style="margin:0">실습생</label><select class="cell" id="feStu">'+list.map(function(s){return '<option value="'+s.id+'"'+(s.id===UI.feSid?' selected':'')+'>'+esc(s.name)+'</option>';}).join("")+'</select><span class="sp"></span><button type="button" class="btn btn-sm btn-out" id="feCfg">'+(UI.feCfg?"평가 항목 설정 닫기":"평가 항목 설정")+'</button></div>'));
  $("feStu").addEventListener("change", function(){ UI.feSid=this.value; renderMain(); });
  $("feCfg").addEventListener("click", function(){ UI.feCfg=!UI.feCfg; renderMain(); });
  // 평가 항목 설정
  if (UI.feCfg){
    var mx = items.reduce(function(t,it){ return t+(Number(it.max)||0); },0);
    var cr = items.map(function(it){
      return '<tr><td><input class="cell" data-ic="'+it.id+'" value="'+esc(it.category)+'" style="width:100px"></td><td><input class="cell" data-ii="'+it.id+'" value="'+esc(it.item)+'" style="width:100%"></td><td><input class="cell" type="number" min="0" data-im="'+it.id+'" value="'+esc(it.max)+'" style="width:64px;text-align:right"></td><td><button type="button" class="btn btn-sm btn-danger" data-idel="'+it.id+'">삭제</button></td></tr>';
    }).join("");
    var cc = h(card("평가 항목 설정 — "+esc(instName(iid)), '배점 합계 '+mx+' (100점으로 환산)',
      tbl(["영역","평가 항목","배점",""], cr) +
      '<div class="toolbar" style="margin-top:12px"><input class="cell" id="niCat" placeholder="영역 (예: 기타 업무)" style="width:130px"><input class="cell" id="niItem" placeholder="평가 항목 (예: 기자재·물품 관리 협조도)" style="flex:1;max-width:none"><input class="cell" id="niMax" type="number" min="0" placeholder="배점" style="width:70px"><button type="button" class="btn btn-sm btn-grad" id="niAdd">항목 추가</button><button type="button" class="btn btn-sm btn-out" id="niReset">기본 틀로 되돌리기</button></div>' +
      '<p class="tiny" style="margin-top:6px">원무·의무기록 외에 기자재 관리, 세탁물 관리, 물품 운반 등 기관 사정에 따른 실습 업무도 평가 항목으로 넣을 수 있습니다.</p>'));
    host.appendChild(cc);
    function fi(id){ return ensureOwn().filter(function(x){return x.id===id;})[0]; }
    cc.querySelectorAll("[data-ic]").forEach(function(i){ i.addEventListener("change", function(){ fi(this.getAttribute("data-ic")).category=this.value; renderMain(); }); });
    cc.querySelectorAll("[data-ii]").forEach(function(i){ i.addEventListener("change", function(){ fi(this.getAttribute("data-ii")).item=this.value; renderMain(); }); });
    cc.querySelectorAll("[data-im]").forEach(function(i){ i.addEventListener("change", function(){ fi(this.getAttribute("data-im")).max=Math.max(0,Number(this.value)||0); renderMain(); }); });
    cc.querySelectorAll("[data-idel]").forEach(function(b){ b.addEventListener("click", function(){ var id=this.getAttribute("data-idel"); DB.evalItemsInst[iid]=ensureOwn().filter(function(x){return x.id!==id;}); renderMain(); }); });
    $("niAdd").addEventListener("click", function(){ var t=$("niItem").value.trim(); if(!t){ toast("평가 항목을 입력하세요."); return; } ensureOwn().push({ id:"x"+Date.now(), category:$("niCat").value.trim()||"기타", item:t, max:Math.max(0,Number($("niMax").value)||10) }); renderMain(); });
    $("niReset").addEventListener("click", function(){ delete DB.evalItemsInst[iid]; renderMain(); toast("기본 틀로 되돌렸습니다."); });
  }
  var box=h('<div id="feBox"></div>'); host.appendChild(box);
  var sid=UI.feSid;
  var ev = evalOf(sid,"FIELD") || { id:"e_"+Date.now(), studentId:sid, kind:"FIELD", scores:{}, overall:"", tasks:"", status:"DRAFT" };
  if (!evalOf(sid,"FIELD")) DB.evaluations.push(ev);
  var readonly = ev.status==="CONFIRMED";
  function total(sc){ return evalTotal(items, sc); }
  var rowsH = items.map(function(it){
    var v=ev.scores[it.id]; v=(v==null||v==="")?"":v;
    var cell = readonly? '<b>'+esc(v===""?"-":v)+'</b> / '+it.max : '<input class="cell" type="number" min="0" max="'+it.max+'" data-it="'+it.id+'" value="'+esc(v)+'" style="width:70px;text-align:right"> / '+it.max;
    return '<tr><td class="mut">'+esc(it.category)+'</td><td>'+esc(it.item)+'</td><td class="num">'+cell+'</td></tr>';
  }).join("");
  var t = readonly? ev.totalScore : total(ev.scores);
  box.innerHTML = card("평가 항목 "+badge(EVST,ev.status), "합계 "+t+" / 100 · 등급 "+gradeOf(t),
    tbl(["영역","평가 항목","배점"], rowsH) +
    '<label class="lb" style="margin-top:12px">실습 수행 업무 내역 <span class="tiny" style="font-weight:400">(원무·의무기록 외 기자재 관리·세탁물 관리·물품 운반 등 포함)</span>'+(readonly?'<p style="white-space:pre-wrap;font-size:13px">'+esc(ev.tasks||"-")+'</p>':'<textarea class="in" id="feTasks" rows="2">'+esc(ev.tasks||"")+'</textarea>')+'</label>' +
    '<label class="lb" style="margin-top:12px">현장 지도자 총평'+(readonly?'<p style="white-space:pre-wrap;font-size:13px">'+esc(ev.overall||"-")+'</p>':'<textarea class="in" id="feOv" rows="3">'+esc(ev.overall||"")+'</textarea>')+'</label>' +

/* ============================================================ *
 *  학생 제출 서류 — 서류 마스터 코드 (학교 행정 관리)
 *  DB.docMaster = { items:[{ id, code, name, desc, common, active }], byInst:{ 기관id:[서류id] } }
 *  · common: 모든 학생 공통 / 아니면 byInst 에 지정된 실습기관에 배정된 학생만 제출
 *  · 학생 제출 상태: DB.studentExtra[sid].docs[서류id] = NONE | SUBMITTED | VERIFIED | REJECTED, 반려 사유 docNotes[서류id]
 *  · 예전 공통 서류(DB.reqDocList rd1~rd5)는 처음 열 때 공통 서류로 옮김 → 학생이 낸 기록 그대로 유지
 * ============================================================ */
function docMaster(){
  if (!DB.docMaster || !Array.isArray(DB.docMaster.items)){
    var items = (DB.reqDocList || []).map(function(rd, i){ return { id:rd.id, code:"DOC-"+String(i+1).padStart(2,"0"), name:rd.name, desc:"", common:true, active:true }; });
    var byInst = {};
    if (!REAL){   // 데모: 기관별 서류 예시
      items.push({ id:"rd_sec", code:"DOC-"+String(items.length+1).padStart(2,"0"), name:"기관 보안서약서 (기관 양식)", desc:"실습기관이 정한 양식으로 작성", common:false, active:true });
      items.push({ id:"rd_emr", code:"DOC-"+String(items.length+1).padStart(2,"0"), name:"정보시스템(EMR) 사용 권한 신청서", desc:"", common:false, active:true });
      apxInsts().forEach(function(it){ if (it.grp === "3차 병원") byInst[it.id] = ["rd_sec","rd_emr"]; else if (it.grp === "기업") byInst[it.id] = ["rd_sec"]; });
    }
    DB.docMaster = { items:items, byInst:byInst };
  }
  DB.docMaster.byInst = DB.docMaster.byInst || {};
  return DB.docMaster;
}
function docNextCode(){ var n = docMaster().items.reduce(function(m, x){ var k = parseInt(String(x.code||"").replace(/\D/g, ""), 10); return isNaN(k) ? m : Math.max(m, k); }, 0); return "DOC-" + String(n+1).padStart(2, "0"); }
/* 학생이 내야 할 서류 = 공통 서류 + 배정된 실습기관의 서류 */
function reqDocsFor(sid){
  var m = docMaster(), s = studentById(sid) || {}, inst = m.byInst[s.institutionId] || [];
  return m.items.filter(function(x){ return x.active && (x.common || inst.indexOf(x.id) >= 0); })
    .sort(function(a, b){ return (b.common - a.common) || String(a.code).localeCompare(String(b.code)); });
}
function docStatus(sid, id){ var ex = DB.studentExtra[sid] || {}; return (ex.docs || {})[id] || "NONE"; }
function docDone(sid){ return reqDocsFor(sid).filter(function(rd){ return docStatus(sid, rd.id) === "VERIFIED"; }).length; }
var DOC_ST = { NONE:["미제출","b-slate"], SUBMITTED:["확인 대기","b-amber"], VERIFIED:["수신 완료","b-teal"], REJECTED:["반려","b-rose"] };
function docFileBtn(sid, id){
  var key = "doc." + id;
  if (REAL){ var f = (RS.files[sid]||{})[key]; if (f) return '<button type="button" class="lnk-b" data-rfile="'+esc(sid)+'|'+esc(key)+'" title="열기">📄 '+esc(f.name)+'</button>'; }
  var u = (typeof DEMO_FILES !== "undefined") && DEMO_FILES[sid + "|" + key];
  if (u) return '<a class="lnk-b" href="'+u+'" target="_blank" rel="noopener" title="열기">📄 '+esc((typeof DEMO_FILE_NAMES !== "undefined" && DEMO_FILE_NAMES[sid + "|" + key]) || "파일 보기")+'</a>';
  return "";
}

/* ---------- 실습기관 배정 연동: 지도교수가 확정·통보한 배정 결과 → 학생 실습기관 ---------- */
function allocInstOf(sid){
  var c = DB.apxSel && DB.apxSel.confirmed; if (!c || !c.result) return null;
  var r = c.result["stu_" + sid]; if (!r || !r.inst) return null;
  var it = apxInsts().filter(function(x){ return apxNorm(x.name) === apxNorm(r.inst); })[0];
  return it ? { id:it.id, name:it.name, grp:it.grp, round:r.round } : null;
}
function syncInstFromAlloc(){
  (DB.students || []).forEach(function(s){
    var a = allocInstOf(s.id); if (!a || s.institutionId === a.id) return;
    s.institutionId = a.id;
    // 그 기관 소속 현장 책임자·담당자가 한 명뿐이면 자동 연결
    var pl = DB.placement[s.id] = DB.placement[s.id] || {};
    ["LEAD","FIELD"].forEach(function(role){
      var k = role === "LEAD" ? "leadId" : "fieldId";
      var cur = (USERS||[]).filter(function(u){ return u.id === pl[k]; })[0];
      if (cur && cur.institutionId === a.id) return;
      var cand = (USERS||[]).filter(function(u){ return u.role === role && u.institutionId === a.id; });
      pl[k] = cand.length === 1 ? cand[0].id : "";
    });
  });
}

var INST_GR = ["3차 병원","2차 병원","기업","기타"];
function instValidate(f, editId){
  var e = {};
  if (!f.name) e.name = "기관명을 입력하세요.";
  else if (apxInsts().some(function(x){ return x.id !== editId && apxNorm(x.name) === apxNorm(f.name); })) e.name = "같은 이름의 기관이 이미 있습니다.";
  if (!f.addr) e.addr = "기관 주소를 입력하세요.";
  if (!f.tel) e.tel = "대표번호를 입력하세요.";
  else if (!/^(0\d{1,2}-?\d{3,4}-?\d{4}|1\d{3}-?\d{4})$/.test(f.tel)) e.tel = "전화번호 형식이 올바르지 않습니다. (예: 02-1234-5678, 1588-1234)";
  if (!f.email) e.email = "이메일을 입력하세요.";
  else if (!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(f.email)) e.email = "이메일 형식이 올바르지 않습니다. (예: info@hospital.or.kr)";
  return e;
}

/* ---------- 기관·공문 서류: 행정 파일 (공문 · 안내문 · 협조 요청서 등) ----------
 *  실제 모드: 파일은 Storage 버킷 'admin-files'(비공개), 정보는 테이블 admin_files (번호 = 테이블의 순번 no)
 *  데모 모드: 브라우저 메모리 */
var AF = { pending:[], busy:false, msg:null, cache:null, tableOk:true };
/* 행정 파일 목록 저장 위치
 *  ① 기본: 테이블 admin_files + 저장소 admin-files (마이그레이션 005)
 *  ② 예비: 테이블을 못 쓰면 공용 문서 shared_docs 'adminFilesDoc' 에 목록 보관 (번호는 문서의 seq)
 *     저장소 admin-files 를 못 쓰면 학생 첨부 저장소 uploads/<내 id>/doc.admin/ 에 보관 (교직원만 열람 가능)
 *  항목마다 bucket 을 기록해 어디에 있든 열고 지울 수 있음 */
function afIsNoTable(e){ return /PGRST20\d|42P01|schema cache|does not exist|could not find the table/i.test((e && (e.code + " " + e.message)) || ""); }
function afDoc(){ if (!DB.adminFilesDoc || !Array.isArray(DB.adminFilesDoc.items)) DB.adminFilesDoc = { seq:0, items:[] }; return DB.adminFilesDoc; }
async function afList(force){
  if (!REAL){ DB.adminFiles = DB.adminFiles || []; return DB.adminFiles.slice().sort(function(a, b){ return b.no - a.no; }); }
  if (AF.cache && !force) return AF.cache;
  var rows = [];
  if (AF.tableOk){
    var r = await SB.from("admin_files").select("*").order("no", { ascending:false });
    if (r.error){ if (afIsNoTable(r.error)) AF.tableOk = false; else throw r.error; }
    else rows = (r.data || []).map(function(x){ return Object.assign({ bucket:"admin-files", src:"table" }, x); });
  }
  var docRows = afDoc().items.map(function(x){ return Object.assign({ src:"doc" }, x); });
  AF.cache = rows.concat(docRows).sort(function(a, b){ return String(b.uploaded_at).localeCompare(String(a.uploaded_at)); });
  return AF.cache;
}
async function afUpload(f){
  var ext = pfExt(f.name); if (ext === "jpeg") ext = "jpg";
  var d = new Date(), stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  var name = stamp + "_" + pfUuid() + "." + ext, type = PF.MATERIAL.exts[pfExt(f.name)];
  var row = { storage_path:"admin/" + name, file_name:f.name.slice(0, 200), file_type:type, file_size:f.size };
  if (!REAL){
    DB.adminFiles = DB.adminFiles || []; DB.adminFilesSeq = (DB.adminFilesSeq || 0) + 1;
    DB.adminFiles.push(Object.assign(row, { id:pfUuid(), no:DB.adminFilesSeq, uploaded_by:SESSION.id, uploaded_by_name:SESSION.name, uploaded_at:new Date().toISOString(), url:URL.createObjectURL(f) }));
    return;
  }
  var bucket = "admin-files", up = await SB.storage.from(bucket).upload(row.storage_path, f, { contentType:type, upsert:false }), firstErr = null;
  if (up.error){   // 예비 저장소
    firstErr = up.error; bucket = "uploads"; row.storage_path = RS.me.id + "/doc.admin/" + name;
    up = await SB.storage.from(bucket).upload(row.storage_path, f, { contentType:type, upsert:false });
    if (up.error){ var e1 = new Error(pfErr(firstErr) + " / 예비 저장소도 실패: " + ((up.error && up.error.message) || up.error)); throw e1; }
  }
  row.uploaded_by = RS.me.id; row.uploaded_by_name = RS.me.name;
  if (AF.tableOk && bucket === "admin-files"){
    var ins = await SB.from("admin_files").insert(row);
    if (!ins.error){ AF.cache = null; return; }
    if (!afIsNoTable(ins.error)){ await SB.storage.from(bucket).remove([row.storage_path]); throw ins.error; }
    AF.tableOk = false;
  }
  // 예비 목록 (공용 문서) — 번호는 seq 로 이어서 매김
  var doc = afDoc(), maxNo = Math.max(doc.seq || 0, (AF.cache || []).reduce(function(m, x){ return Math.max(m, Number(x.no) || 0); }, 0));
  doc.seq = maxNo + 1;
  doc.items.push(Object.assign(row, { id:pfUuid(), no:doc.seq, bucket:bucket, uploaded_at:new Date().toISOString() }));
  AF.cache = null;
  await realSave();
  if (RS.err) throw new Error("파일은 올렸지만 목록을 저장하지 못했습니다: " + RS.err);
}
/* 보기(새 창) · 다운로드 — 실제 모드는 잠깐(2분)만 쓰는 인증 링크 */
async function afOpen(x, download){
  var url = x.url;
  if (REAL){
    var r = await SB.storage.from(x.bucket || "admin-files").createSignedUrl(x.storage_path, 120, download ? { download:x.file_name } : undefined);
    if (r.error) throw r.error; url = r.data.signedUrl;
  }
  var a = document.createElement("a"); a.href = url; a.rel = "noopener";
  if (download) a.download = x.file_name; else a.target = "_blank";
  document.body.appendChild(a); a.click(); a.remove();
}
async function afDelete(x){
  if (!REAL){ DB.adminFiles = (DB.adminFiles||[]).filter(function(y){ return y.id !== x.id; }); return; }
  if (x.src === "doc"){
    var doc = afDoc(); doc.items = doc.items.filter(function(y){ return y.id !== x.id; });
    await realSave(); if (RS.err) throw new Error(RS.err);
  } else {
    var del = await SB.from("admin_files").delete().eq("id", x.id);
    if (del.error) throw del.error;
  }
  var rm = await SB.storage.from(x.bucket || "admin-files").remove([x.storage_path]);
  if (rm.error) console.warn("파일 삭제 실패(목록에서는 삭제됨):", rm.error.message);
  AF.cache = null;
}
