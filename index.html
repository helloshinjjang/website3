/* ============================================================ *
 *  기관 서류 마스터 코드 — 학교가 기관에 보낼 서류(OUT) / 기관에서 받을 서류(IN)
 *  DB.instDocMaster = { items:[{ id, code, name, dir:"OUT"|"IN", desc, common, active }], byInst:{ 기관id:[서류id] } }  (공용 문서)
 *  DB.instDocStatus = { 기관id: { 서류id: { st, at, by, note, file:{ file_name, storage_path, bucket, file_size, url } } } }   (교직원 문서)
 *    보낼 서류 st: TODO(준비 중) · SENT(발송 완료)   받을 서류 st: WAIT(미수신) · RECEIVED(수신 완료) · REJECTED(보완 요청)
 * ============================================================ */
function instDocMaster(){
  if (!DB.instDocMaster || !Array.isArray(DB.instDocMaster.items)){
    var seed = [["OUT","현장실습 협조 요청 공문"],["OUT","실습생 명단"],["OUT","표준 현장실습 협약서 (학교 날인)"],["OUT","단체 상해보험 가입 증명서"],
                ["IN","실습 수락 회신서"],["IN","표준 현장실습 협약서 (기관 날인본)"],["IN","실습생 평가표"],["IN","실습 출근부"]];
    var n = { OUT:0, IN:0 };
    DB.instDocMaster = { items: seed.map(function(r){ n[r[0]]++; return { id:"idm_" + r[0].toLowerCase() + n[r[0]], code:r[0] + "-" + String(n[r[0]]).padStart(2, "0"), name:r[1], dir:r[0], desc:"", common:true, active:true }; }), byInst:{} };
  }
  DB.instDocMaster.byInst = DB.instDocMaster.byInst || {};
  return DB.instDocMaster;
}
function instDocNextCode(dir){ var n = instDocMaster().items.filter(function(x){ return x.dir === dir; }).reduce(function(m, x){ var k = parseInt(String(x.code).replace(/\D/g, ""), 10); return isNaN(k) ? m : Math.max(m, k); }, 0); return dir + "-" + String(n + 1).padStart(2, "0"); }
function instDocsFor(iid, dir){
  var m = instDocMaster(), sel = m.byInst[iid] || [];
  return m.items.filter(function(x){ return x.active && x.dir === dir && (x.common || sel.indexOf(x.id) >= 0); }).sort(function(a, b){ return String(a.code).localeCompare(String(b.code)); });
}
function instDocSt(iid, id){ DB.instDocStatus = DB.instDocStatus || {}; var o = DB.instDocStatus[iid] = DB.instDocStatus[iid] || {}; return o[id] = o[id] || {}; }
var IDS = { TODO:["준비 중","b-slate"], SENT:["발송 완료","b-teal"], WAIT:["미수신","b-slate"], RECEIVED:["수신 완료","b-teal"], REJECTED:["보완 요청","b-rose"] };
function instDocProgress(iid){
  var out = instDocsFor(iid, "OUT"), inn = instDocsFor(iid, "IN");
  return { out:out.length, outDone:out.filter(function(d){ return instDocSt(iid, d.id).st === "SENT"; }).length,
           inn:inn.length, inDone:inn.filter(function(d){ return instDocSt(iid, d.id).st === "RECEIVED"; }).length };
}
/* 행정 파일 저장 (기관 서류 · 행정 파일 공용) — 전용 저장소 admin-files, 안 되면 uploads/<내 id>/doc.admin/ */
async function adminStore(f){
  var ext = pfExt(f.name); if (ext === "jpeg") ext = "jpg";
  var d = new Date(), stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  var name = stamp + "_" + pfUuid() + "." + ext, type = PF.MATERIAL.exts[pfExt(f.name)];
  var file = { file_name:f.name.slice(0, 200), file_size:f.size, file_type:type };
  if (!REAL) return Object.assign(file, { bucket:"demo", storage_path:"demo/" + name, url:URL.createObjectURL(f) });
  var r = await SB.storage.from("admin-files").upload("admin/" + name, f, { contentType:type, upsert:false });
  if (!r.error) return Object.assign(file, { bucket:"admin-files", storage_path:"admin/" + name });
  var first = r.error, p2 = RS.me.id + "/doc.admin/" + name;
  r = await SB.storage.from("uploads").upload(p2, f, { contentType:type, upsert:false });
  if (r.error) throw new Error(pfErr(first) + " / 예비 저장소도 실패: " + ((r.error && r.error.message) || r.error));
  return Object.assign(file, { bucket:"uploads", storage_path:p2 });
}

/* ============================================================ *
 *  신청서 수정 요청 → 지도교수 수락 → 학생 재수정
 *  · 학생: ex.applyEditReq = { at, reason }            (학생 본인 문서)
 *  · 교수: ex.applyUnlock  = { at, by, reason }          (교수가 쓸 수 있는 칸 — 신청서 본문(apply)은 교수가 못 바꿈)
 *  · 학생 화면이 열릴 때 수락이 확인되면 학생 본인이 신청서를 '작성 중'으로 되돌림 → 고쳐서 다시 제출
 * ============================================================ */
function applyUnlockPending(ex){
  var a = ex && ex.apply, u = ex && ex.applyUnlock;
  return !!(a && u && u.at && a.status === "SUBMITTED" && String(u.at) > String(a.submittedAt || "") && String(u.at) > String(a.unlockedAt || ""));
}
function applyReopenIfUnlocked(ex){
  if (!applyUnlockPending(ex)) return false;
  var a = ex.apply;
  a.status = "DRAFT"; a.unlockedAt = ex.applyUnlock.at; a.reopenCount = (a.reopenCount||0) + 1;
  delete ex.applyEditReq;
  return true;
}

/* ============================================================ *
 *  사전교육 운영 보고서 PDF — html2canvas + jsPDF 로 구역별로 그려 A4 페이지에 배치
 *  (큰 화면 한 장을 통째로 그리지 않아 브라우저 메모리 한도에 걸리지 않음)
 * ============================================================ */
var H2C_SRC = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
var JSPDF_SRC = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
var _scriptP = {};
function loadScript(src, ready){
  if (ready()) return Promise.resolve();
  if (_scriptP[src]) return _scriptP[src];
  _scriptP[src] = new Promise(function(ok, no){
    var s = document.createElement("script"); s.src = src; s.async = true; s.crossOrigin = "anonymous";
    s.onload = function(){ ready() ? ok() : no(new Error("라이브러리를 불러오지 못했습니다: " + src)); };
    s.onerror = function(){ delete _scriptP[src]; no(new Error("라이브러리를 불러오지 못했습니다 (인터넷 연결 확인): " + src)); };
    document.head.appendChild(s);
  });
  return _scriptP[src];
}
/* 사진을 PDF에 넣기 좋게 줄임 (긴 변 1400px JPEG) */
function shrinkImage(dataUrl){
  return new Promise(function(ok){
    if (!dataUrl) return ok("");
    var im = new Image();
    im.onload = function(){
      var k = Math.min(1, 1400 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      try { ok(c.toDataURL("image/jpeg", 0.85)); } catch (e){ ok(""); }
    };
    im.onerror = function(){ ok(""); };
    im.src = dataUrl;
  });
}
async function prepReportPDF(ps, btn){

    await loadScript(JSPDF_SRC, function(){ return !!(window.jspdf && window.jspdf.jsPDF); });
    step = "보고서 내용 만들기";
    holder.style.cssText = "position:fixed;left:0;top:0;width:760px;background:#fff;z-index:-1;pointer-events:none;opacity:1";

    document.body.appendChild(holder);
    var imgs = holder.querySelectorAll("img");
    for (var i = 0; i < imgs.length; i++){ imgs[i].src = await shrinkImage(imgs[i].getAttribute("src")); }
    await Promise.all(Array.prototype.map.call(holder.querySelectorAll("img"), function(im){ return (im.complete && im.naturalWidth) ? 0 : new Promise(function(ok){ im.onload = im.onerror = ok; }); }));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    step = "PDF 만들기";
    var rp = holder.querySelector(".rp"), blocks = [];
    Array.prototype.forEach.call(rp.children, function(el){
      if (el.classList.contains("rp-ph")) Array.prototype.forEach.call(el.children, function(r){ blocks.push(r); }); else blocks.push(el);
    });
    var JsPDF = window.jspdf.jsPDF, pdf = new JsPDF({ unit:"mm", format:"a4", orientation:"portrait" });
    var PW = 210, PH = 297, M = 14, CW = PW - M*2, BOTTOM = PH - M - 6;
    var rpRect = rp.getBoundingClientRect(), padL = parseFloat(getComputedStyle(rp).paddingLeft) || 0;
    var innerW = rpRect.width - padL * 2, k = CW / innerW, y = M, first = true;
    for (var b = 0; b < blocks.length; b++){
      var el = blocks[b], r = el.getBoundingClientRect();
      if (!r.height) continue;
      var cs = getComputedStyle(el), gap = first ? 0 : Math.max(1.5, (parseFloat(cs.marginTop) || 0) * k);
      var canvas = await window.html2canvas(el, { scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false, scrollX:0, scrollY:-window.scrollY });
      var wmm = r.width * k, hmm = r.height * k, x = M + (r.left - rpRect.left - padL) * k;
      var isHead = el.tagName === "H2", next = blocks[b+1];
      var nextH = isHead && next ? next.getBoundingClientRect().height * k : 0;
      var need = hmm + (isHead && next ? (nextH <= BOTTOM - M - hmm - 2 ? nextH : 40) : 0);   // 제목은 다음 내용과 같은 페이지에
      if (!first && y + gap + need > BOTTOM && hmm <= BOTTOM - M){ pdf.addPage(); y = M; gap = 0; }
      y += gap;
      if (hmm <= BOTTOM - y){
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", x, y, wmm, hmm);
        Array.prototype.forEach.call(el.querySelectorAll("a[href^='http']"), function(a){
          var ar = a.getBoundingClientRect(); pdf.link(x + (ar.left - r.left) * k, y + (ar.top - r.top) * k, ar.width * k, ar.height * k, { url:a.href });
        });
        y += hmm;
      } else {   // 한 페이지보다 긴 구역은 잘라서 이어 붙임
        var pxPerMm = canvas.height / hmm, done = 0;
        while (done < hmm - 0.01){
          var room = BOTTOM - y, part = Math.min(room, hmm - done);
          var sc = document.createElement("canvas"); sc.width = canvas.width; sc.height = Math.max(1, Math.round(part * pxPerMm));
          sc.getContext("2d").drawImage(canvas, 0, Math.round(done * pxPerMm), canvas.width, sc.height, 0, 0, canvas.width, sc.height);
          pdf.addImage(sc.toDataURL("image/jpeg", 0.92), "JPEG", x, y, wmm, part);
          done += part; y += part;
          if (done < hmm - 0.01){ pdf.addPage(); y = M; }
        }
      }
      first = false;
    }
    var n = pdf.getNumberOfPages();
    for (var pg = 1; pg <= n; pg++){ pdf.setPage(pg); pdf.setFontSize(8); pdf.setTextColor(150); pdf.text(pg + " / " + n, PW - M, PH - 8, { align:"right" }); }
    var fname = ("사전교육_운영보고서_" + (ps.title||"") + "_" + (ps.date||"")).replace(/[\\\/:*?"<>|\s]+/g, "_").replace(/_+$/, "") + ".pdf";
    step = "파일 저장";
    pdf.save(fname);
    toast("운영 보고서 PDF를 내려받았습니다.");
  } catch (e){
    var msg = (e && e.message) || String(e);
    console.error("PDF 오류(" + step + "):", e);
    toast("PDF를 만들지 못했습니다 (" + step + "): " + msg + " — [인쇄로 PDF 저장]을 이용하세요.");
  } finally { holder.remove(); if (btn){ btn.disabled = false; btn.textContent = t; } }
}

    case "apxInsts": DB.apxInsts = v; break;

    case "rbac":
      if (v.roleDefs){

        RBAC_NEW.forEach(function(n){
          var id = n[0] + ":" + n[1]; if (RBAC_AUTO.indexOf(id) >= 0) return;
          var arr = DEFAULT_ROLE_PERMS[n[0]] = DEFAULT_ROLE_PERMS[n[0]] || [];

function realEnsureSel(){

    if (!DB.codeGroups.some(function(x){ return x.code === g.code; })) DB.codeGroups.push({ code:g.code, name:g.name, fields:g.fields, sel:true });

function realRole(){ return RS.me ? RS.me.role : null; }
function realIsStaff(){ return ["FACULTY","LEAD","FIELD","STAFF","ADMIN"].indexOf(realRole()) >= 0; }
function realIsManager(){ return ["FACULTY","STAFF","ADMIN"].indexOf(realRole()) >= 0; }
function realJSON(v){ return JSON.stringify(v === undefined ? null : v); }
function realClone(v){ return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function realIsObj(v){ return v && typeof v === "object" && !Array.isArray(v); }
/* 다른 사람이 그사이 저장한 내용을 지우지 않도록: 서버 값 위에 내가 바꾼 항목(2단계 키)만 덮어씀 */
function realMerge(server, local, saved){
  if (!realIsObj(local) || !realIsObj(server) || !realIsObj(saved)) return realClone(local);
  var out = realClone(server), keys = {};
  Object.keys(local).concat(Object.keys(saved)).forEach(function(k){ keys[k] = 1; });
  Object.keys(keys).forEach(function(k){
    if (realJSON(local[k]) === realJSON(saved[k])) return;
    if (realIsObj(local[k]) && realIsObj(saved[k]) && realIsObj(out[k])){
      var sk = {}; Object.keys(local[k]).concat(Object.keys(saved[k])).forEach(function(x){ sk[x] = 1; });
      Object.keys(sk).forEach(function(x){ if (realJSON(local[k][x]) !== realJSON(saved[k][x])){ if (local[k][x] === undefined) delete out[k][x]; else out[k][x] = realClone(local[k][x]); } });
    } else if (local[k] === undefined) delete out[k]; else out[k] = realClone(local[k]);
  });
  return out;
}
/* 배열(실습일지·출결)은 id 기준으로 내가 바꾼 항목만 반영 */
function realMergeById(server, local, saved){
  var sv = {}; (saved||[]).forEach(function(x){ sv[x.id] = realJSON(x); });
  var map = {}, order = [];
  (server||[]).forEach(function(x){ map[x.id] = x; order.push(x.id); });
  (local||[]).forEach(function(x){ if (sv[x.id] !== realJSON(x)){ if (!map[x.id]) order.push(x.id); map[x.id] = x; } });
  return order.map(function(id){ return map[id]; });
}
function realUserDocs(sid){
  var ex = DB.studentExtra[sid];
  var d = {
    extra: ex ? ex : null,
    logs: DB.logs.filter(function(l){ return l.studentId === sid; }),
    attendance: DB.attendance.filter(function(a){ return a.studentId === sid; }),
    survey: DB.surveyResponses.filter(function(r){ return r.respondent === "STUDENT" && r.studentId === sid; })[0] || null
  };
  if (realIsStaff()){
    var c = DB.apxSel && DB.apxSel.confirmed;
    d.apxResult = c ? { at:c.at, result: c.result["stu_"+sid] === undefined ? null : c.result["stu_"+sid] } : { at:null, result:null };
  }
  return d;
}
/* 학교 행정(STAFF)이 읽거나 쓸 수 없는 문서 — 선발 점수 · 성적 · 평가 (서버 마이그레이션 005와 같은 목록) */
var REAL_STAFF_HIDDEN = ["apxSel","grading","evaluations","facultyChecks"];
function realCollect(){
  var out = {}, me = RS.me, isAdm = realRole() === "STAFF";
  if (realIsManager()) REAL_PUBLIC.forEach(function(k){ out["s:public:"+k] = realGet(k); });
  if (realIsStaff()) REAL_STAFF.forEach(function(k){ if (isAdm && REAL_STAFF_HIDDEN.indexOf(k) >= 0) return; out["s:staff:"+k] = realGet(k); });
  // 행정 계정은 학생 문서를 직접 저장하지 않음 (서류 상태는 서버 함수 staff_set_doc_status 로만 바꿈)
  var sids = (realIsStaff() && !(isAdm && RS.staffDocsRpc)) ? DB.students.map(function(s){ return s.id; }) : (me && me.role === "STUDENT" ? [me.id] : []);
  sids.forEach(function(sid){ var d = realUserDocs(sid); Object.keys(d).forEach(function(k){ if (d[k] !== null || RS.saved["u:"+sid+":"+k] !== undefined) out["u:"+sid+":"+k] = d[k]; }); });
  return out;
}
function realProfileSnap(u){
  var info = { institutionId: u.institutionId || "" };
  if (u.role === "STUDENT"){
    var s = studentById(u.id) || {}, pl = DB.placement[u.id] || {};
    info = { institutionId:s.institutionId||"", area:s.area||"", start:s.start||"", end:s.end||"", facultyId:pl.facultyId||"", leadId:pl.leadId||"", fieldId:pl.fieldId||"" };
  }

}
function realSetState(t, err){
  RS.err = err || "";
  var el = $("realSave"); if (!el) return;
  el.className = "real-save " + t;
  el.textContent = t === "busy" ? "저장 중…" : t === "err" ? "저장 실패 · 다시 시도 중" : t === "ok" ? "저장됨 "+fmtTime(RS.lastAt) : "";
  el.title = err || "";
}
function realQueueSave(){
  if (!REAL || !RS.me) return;
  clearTimeout(RS.timer); RS.timer = setTimeout(realSave, 700);
}
async function realSave(){
  if (!REAL || !RS.me) return;
  if (RS.busy){ RS.pending = true; return; }
  var cur = realCollect(), changed = Object.keys(cur).filter(function(k){ return realJSON(cur[k]) !== realJSON(RS.saved[k]); });
  var profChanged = [];
  if (realIsManager()) (USERS||[]).forEach(function(u){ var snap = realProfileSnap(u); if (realJSON(snap) !== realJSON(RS.savedProfiles[u.id])) profChanged.push([u.id, snap]); });
  if (!changed.length && !profChanged.length) return;
  RS.busy = true; realSetState("busy");
  try {
    for (var i = 0; i < changed.length; i++){
      var k = changed[i], p = k.split(":"), local = realClone(cur[k]), saved = RS.saved[k], row, res, now = new Date().toISOString();
      if (p[0] === "s"){
        res = await SB.from("shared_docs").select("data").eq("key", p[2]).maybeSingle(); if (res.error) throw res.error;
        var data = (res.data && saved !== undefined) ? realMerge(res.data.data, local, saved) : local;
        res = await SB.from("shared_docs").upsert({ key:p[2], scope:p[1], data:data, updated_at:now, updated_by:RS.me.id }); if (res.error) throw res.error;
        RS.saved[k] = realClone(local);
      } else {
        res = await SB.from("user_docs").select("data").eq("user_id", p[1]).eq("kind", p[2]).maybeSingle(); if (res.error) throw res.error;
        var sv = res.data ? res.data.data : null, merged;
        if (p[2] === "logs" || p[2] === "attendance") merged = realMergeById(sv, local, saved);
        else merged = (sv && saved !== undefined) ? realMerge(sv, local, saved) : local;
        res = await SB.from("user_docs").upsert({ user_id:p[1], kind:p[2], data:merged, updated_at:now, updated_by:RS.me.id }); if (res.error) throw res.error;
        RS.saved[k] = realClone(local);
      }
    }
    for (var j = 0; j < profChanged.length; j++){
      var id = profChanged[j][0], sn = profChanged[j][1];
      var r2 = await SB.from("profiles").update({ name:sn.name, role:sn.role, status:sn.status, info:sn.info }).eq("id", id); if (r2.error) throw r2.error;
      RS.savedProfiles[id] = realClone(sn);
    }
    RS.lastAt = new Date().toISOString(); realSetState("ok");
  } catch (e){
    realSetState("err", (e && e.message) || String(e));
  } finally {
    RS.busy = false;
    if (RS.pending){ RS.pending = false; realQueueSave(); }
  }
}

  PLC.saved = null; PLC.draft = null; DB.prepFiles = []; DB.prepSessions = null; DB._prepFromServer = false; DB.docMaster = null;

function realProfileToUser(p){

  return { id:p.id, name:p.name, loginId:p.login_id, email:(/@hip-users\.local$/.test(p.email||"") ? "" : p.email), role:p.role, status:p.status, requestedRole:p.requested_role, studentNo:p.student_no,
    studentId: p.role === "STUDENT" ? p.id : undefined, institutionId: info.institutionId || "", mustChangePw: !!p.must_change_pw };
}
async function realLoad(){
  var res = await SB.from("profiles").select("*"); if (res.error) throw res.error;
  var profs = res.data || [];
  USERS = profs.map(realProfileToUser);
  DB.students = profs.filter(function(p){ return p.role === "STUDENT"; }).map(function(p){
    var i = p.info || {};

  });
  if (RS.me.role === "STUDENT" && mine.at) DB.apxSel = { scores:{}, cond:{}, map:{}, confirmed:{ at:mine.at, result:(function(){ var o = {}; o["stu_"+RS.me.id] = mine.result; return o; })() } };
  if (!DB.studentExtra[RS.me.id] && RS.me.role === "STUDENT"){
    var edu = {}; DB.preEducation.forEach(function(pe){ edu[pe.id] = false; });

  try { await plcLoadReal(); } catch (e){ toast("배정 결과를 불러오지 못했습니다: " + ((e && e.message) || e)); }
}

/* ---------- 첨부 파일: 실제 파일을 비공개 저장소에 올림 ---------- */
async function realUpload(file, key){
  // Supabase 저장소 경로에는 한글을 쓸 수 없음(Invalid key) → 경로는 영문·숫자만, 원래 파일명은 files 목록에 저장
  var ext = (String(file.name).match(/\.([A-Za-z0-9]{1,8})$/) || [])[1];
  var path = RS.me.id + "/" + key.replace(/[^\w.\-]+/g, "_") + "/" + Date.now() + "_" + Math.random().toString(36).slice(2, 10) + (ext ? "." + ext.toLowerCase() : "");
  var res = await SB.storage.from("uploads").upload(path, file, { upsert:false, contentType:file.type || "application/octet-stream" });
  if (res.error) throw res.error;
  var files = RS.files[RS.me.id] = RS.files[RS.me.id] || {};
  files[key] = { name:file.name, path:path, size:file.size, at:new Date().toISOString() };
  var r2 = await SB.from("user_docs").upsert({ user_id:RS.me.id, kind:"files", data:files, updated_at:new Date().toISOString(), updated_by:RS.me.id });
  if (r2.error) throw r2.error;
  RS.saved["u:"+RS.me.id+":files"] = realClone(files);
  return path;
}
async function realOpenFile(uid, key){
  var f = (RS.files[uid]||{})[key]; if (!f){ toast("저장된 파일이 없습니다."); return; }
  var res = await SB.storage.from("uploads").createSignedUrl(f.path, 120);
  if (res.error){ toast("파일을 열 수 없습니다: "+res.error.message); return; }
  var a = document.createElement("a"); a.href = res.data.signedUrl; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
}
function realFileKey(inp){
  if (inp.getAttribute("data-file")) return "apply." + inp.getAttribute("data-file");
  if (inp.id === "apxPhotoIn") return "apply.photo";
  if (inp.getAttribute("data-rd")) return "doc." + inp.getAttribute("data-rd");
  if (inp.id === "ecFile") return "doc.eduCert";
  return null;   // 실습일지·과제 사진은 화면에서 줄여 신청 문서 안에 함께 저장
}
function realFileLinks(uid, prefix){
  var f = RS.files[uid] || {}, ks = Object.keys(f).filter(function(k){ return k.indexOf(prefix) === 0; });
  return ks.map(function(k){ return '<button type="button" class="lnk sm" data-rfile="'+esc(uid)+'|'+esc(k)+'">'+esc(f[k].name)+'</button>'; }).join(" · ");
}
document.addEventListener("click", function(e){

/* ---------- 로그인 · 비밀번호 (학번 로그인 · 임시 비밀번호 · 첫 로그인 시 변경) ----------
 *  · 계정은 관리자가 [계정 관리]에서 만듭니다. 아이디 = 학번(교직원·기관은 관리자가 정한 아이디), 비밀번호 = 임시 비밀번호
 *  · 임시 비밀번호로 처음 로그인하면 새 비밀번호를 정해야 화면에 들어갈 수 있습니다.
 *  · 로그인 후에는 왼쪽 아래 [비밀번호 변경]으로 언제든 바꿀 수 있습니다.
 *  · 비밀번호를 잊으면 관리자가 [계정 관리]에서 임시 비밀번호로 초기화합니다. */
var PW_MIN = 8;
function realMsg(id, text, ok){ var m = $(id); if (!m) return; m.className = "msg" + (ok ? " ok" : ""); m.textContent = text; m.hidden = !text; }
function realPwRule(a, b, old){
  if (a.length < PW_MIN) return "새 비밀번호는 " + PW_MIN + "자 이상이어야 합니다.";
  if (!/[A-Za-z]/.test(a) || !/[0-9]/.test(a)) return "새 비밀번호는 영문과 숫자를 함께 넣어 주세요.";
  if (a !== b) return "새 비밀번호가 서로 일치하지 않습니다.";
  if (old != null && a === old) return "지금 비밀번호와 다른 비밀번호를 정해 주세요.";
  return "";
}
function realRpcErr(e){
  var m = (e && (e.message || e.details)) || String(e || "");
  if (/WRONG_PASSWORD/.test(m)) return "지금 비밀번호가 올바르지 않습니다.";
  if (/SAME_PASSWORD/.test(m)) return "지금 비밀번호와 다른 비밀번호를 정해 주세요.";
  if (/WEAK_PASSWORD/.test(m)) return "새 비밀번호는 " + PW_MIN + "자 이상, 영문과 숫자를 함께 넣어 주세요.";
  if (/LOGIN_EXISTS/.test(m)) return "이미 있는 아이디입니다.";
  if (/BAD_LOGIN/.test(m)) return "아이디는 영문·숫자·밑줄 3~30자여야 합니다.";
  if (/BAD_ROLE/.test(m)) return "역할이 올바르지 않습니다.";
  if (/NOT_ADMIN/.test(m)) return "관리자만 할 수 있습니다.";
  if (/SELF/.test(m)) return "본인 계정은 여기서 처리할 수 없습니다.";
  return m;
}
function realAuthUI(){
  // 회원가입 없음: 계정은 관리자가 만들어 줍니다.

var REAL_BUSY = false;

    if (!email){ realMsg("lgMsg", "아이디 또는 비밀번호가 올바르지 않습니다."); return; }
    var res = await SB.auth.signInWithPassword({ email:email, password:pw });

    $("lgPw").value = "";
    await realEnter(res.data.user);
  } catch (e){ realMsg("lgMsg", "로그인하지 못했습니다: " + ((e && e.message) || e)); }

async function realEnter(user){

    '<div class="fld"><label for="pwNew">새 비밀번호</label><input id="pwNew" type="password" autocomplete="new-password" placeholder="' + PW_MIN + '자 이상, 영문+숫자"></div>' +

    if (busy) return;
    var cur = $("pwCur").value, a = $("pwNew").value, b = $("pwNew2").value;
    if (!cur) return realMsg("pwMsg", "임시 비밀번호를 입력하세요.");
    var bad = realPwRule(a, b, cur); if (bad) return realMsg("pwMsg", bad);
    busy = true; realMsg("pwMsg", "바꾸는 중…", true);
    try {
      var r = await SB.rpc("change_my_password", { p_old:cur, p_new:a });

    } catch (e){ realMsg("pwMsg", "바꾸지 못했습니다: " + realRpcErr(e)); }
    finally { busy = false; }
  }
  $("pwBtn").addEventListener("click", go);
  $("pwNew2").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); go(); } });
  $("pwCancel").addEventListener("click", function(){ SB.auth.signOut().finally(function(){ location.reload(); }); });

      var jobs = [], errs = [];
      lines.forEach(function(l, i){
        var c = l.split(/\t|,/).map(function(x){ return x.trim(); });
        if (/^(아이디|학번|id)$/i.test(c[0])) return;   // 머리글 줄은 건너뜀
        var role = realRoleOf(c[3]), pw = c[2] || common;
        if (!c[0] || !c[1]) errs.push((i+1)+"번째 줄: 아이디와 이름이 필요합니다.");
        else if (!role) errs.push((i+1)+"번째 줄: 역할 '"+c[3]+"'을(를) 알 수 없습니다.");
        else if (!pw) errs.push((i+1)+"번째 줄: 임시 비밀번호가 없습니다(공통 임시 비밀번호를 넣거나 3번째 칸에 적으세요).");
        else if (pw.length < 6) errs.push((i+1)+"번째 줄: 임시 비밀번호는 6자 이상이어야 합니다.");
        else jobs.push({ line:i+1, login:c[0].toLowerCase(), name:c[1], pw:pw, role:role });
      });
      if (errs.length){ out.textContent = "고칠 곳이 있어 아무 계정도 만들지 않았습니다.\n" + errs.join("\n"); out.style.color = "#C2412D"; return; }
      btn.disabled = true; out.style.color = ""; var ok = 0, fail = [];
      for (var k = 0; k < jobs.length; k++){
        var j = jobs[k]; out.textContent = "만드는 중… " + (k+1) + " / " + jobs.length;
        var r = await SB.rpc("admin_create_account", { p_login:j.login, p_name:j.name, p_password:j.pw, p_role:j.role });
        if (r.error) fail.push(j.line + "번째 줄 (" + j.login + "): " + realRpcErr(r.error));
        else { ok++; realAddProfile(r.data); }
      }
      btn.disabled = false;
      UI.bkResult = "계정 " + ok + "개를 만들었습니다." + (fail.length ? "\n만들지 못한 줄:\n" + fail.join("\n") : "");
      if (!fail.length) UI.bkText = ""; else UI.bkText = $("bkText").value;
      renderMain();
    });
    if (UI.bkResult){ $("bkOut").textContent = UI.bkResult; UI.bkResult = ""; }
    if (UI.bkText){ $("bkText").value = UI.bkText; UI.bkText = ""; }
  }

  /* 2) 계정 목록 */
  UI.accFilter = UI.accFilter || "ALL";
  UI.accQ = UI.accQ || "";
  var all = USERS || [];
  var filters = [["ALL","전체 ("+all.length+")"]].concat(Object.keys(ROLES).map(function(r){ return [r, ROLES[r]+" ("+all.filter(function(u){ return u.role === r; }).length+")"]; }));
  var bar = h('<div class="toolbar"></div>');
  filters.forEach(function(f){ var b = h('<button type="button" class="btn btn-sm '+(f[0]===UI.accFilter?"btn-teal":"btn-out")+'">'+esc(f[1])+'</button>'); b.addEventListener("click", function(){ UI.accFilter = f[0]; renderMain(); }); bar.appendChild(b); });
  var q = h('<input class="cell" id="accQ" placeholder="이름·아이디 검색" style="width:160px">'); q.value = UI.accQ;
  q.addEventListener("input", function(){ UI.accQ = this.value; var pos = this.selectionStart; renderMain(); var n = $("accQ"); if (n){ n.focus(); n.setSelectionRange(pos, pos); } });
  bar.appendChild(q);
  host.appendChild(bar);
  var insts = apxInsts();
  var qq = UI.accQ.trim().toLowerCase();
  var list = all.filter(function(u){ return (UI.accFilter === "ALL" || u.role === UI.accFilter) && (!qq || String(u.name).toLowerCase().indexOf(qq) >= 0 || String(u.loginId).toLowerCase().indexOf(qq) >= 0); })
    .sort(function(a, b){ return String(a.loginId).localeCompare(String(b.loginId)); });
  var roleOpts = Object.keys(ROLES);
  var rows = list.map(function(u){
    var me = u.id === RS.me.id, dis = (me || !isAdmin) ? ' disabled' : '';
    return '<tr><td><b>'+esc(u.name)+'</b><div class="tiny">'+esc(u.loginId)+'</div></td>' +
      '<td><select class="cell" data-uid="'+u.id+'" data-f="role"'+dis+'>'+roleOpts.map(function(r){ return '<option value="'+r+'"'+(r===u.role?' selected':'')+'>'+esc(ROLES[r])+'</option>'; }).join("")+'</select></td>' +
      '<td>'+((u.role==="LEAD"||u.role==="FIELD") ? '<select class="cell" data-uid="'+u.id+'" data-f="institutionId"><option value="">소속 기관 선택</option>'+insts.map(function(i){ return '<option value="'+i.id+'"'+(i.id===u.institutionId?' selected':'')+'>'+esc(i.name)+'</option>'; }).join("")+'</select>' : '<span class="tiny">-</span>')+'</td>' +
      '<td><select class="cell" data-uid="'+u.id+'" data-f="status"'+dis+'><option value="ACTIVE"'+((u.status||"ACTIVE")==="ACTIVE"?' selected':'')+'>사용</option><option value="LOCKED"'+(u.status==="LOCKED"?' selected':'')+'>사용 중지</option></select></td>' +
      '<td>'+(u.mustChangePw ? '<span class="badge b-amber">임시 비밀번호</span>' : '<span class="badge b-teal">변경 완료</span>')+'</td>' +
      '<td>'+(isAdmin && !me ? '<button type="button" class="btn btn-sm btn-out" data-reset="'+u.id+'">비밀번호 초기화</button> <button type="button" class="btn btn-sm btn-danger" data-del="'+u.id+'">삭제</button>' : '')+'</td></tr>';
  }).join("");
  host.appendChild(h(tbl(["이름 / 아이디","역할","소속 기관 (현장)","사용","비밀번호","처리"], rows || '<tr><td colspan="6" class="empty">해당 사용자가 없습니다.</td></tr>')));
  host.appendChild(h('<p class="notice" style="margin-top:12px">비밀번호를 잊은 사용자는 [비밀번호 초기화]로 새 임시 비밀번호를 정해 알려 주세요. 그 사용자는 다음 로그인 때 다시 새 비밀번호를 정해야 합니다. 관리자도 다른 사람의 비밀번호를 볼 수는 없습니다. 역할·기관·사용 여부는 자동 저장됩니다.</p>'));
  function find(id){ return all.filter(function(x){ return x.id === id; })[0]; }
  host.querySelectorAll("[data-uid]").forEach(function(sel){ sel.addEventListener("change", function(){
    var u = find(this.getAttribute("data-uid")), f = this.getAttribute("data-f"); u[f] = this.value;
    if (f === "role" && this.value === "STUDENT" && !studentById(u.id)) DB.students.push({ id:u.id, name:u.name, no:u.studentNo||u.loginId||"", school:APP_CONFIG.schoolName||"", institutionId:"", area:"", start:DB.term.start, end:DB.term.end });
    if (f === "role") u.studentId = this.value === "STUDENT" ? u.id : undefined;
    renderMain(); toast(u.name+" 정보를 바꿨습니다.");
  }); });
  host.querySelectorAll("[data-reset]").forEach(function(b){ b.addEventListener("click", async function(){
    var u = find(this.getAttribute("data-reset"));
    var pw = window.prompt(u.name + " (" + u.loginId + ") 의 새 임시 비밀번호를 입력하세요. (6자 이상)\n이 비밀번호를 본인에게 알려 주면, 다음 로그인 때 새 비밀번호로 바꾸게 됩니다.", "");
    if (pw == null) return; pw = pw.trim();
    if (pw.length < 6){ toast("임시 비밀번호는 6자 이상이어야 합니다."); return; }
    var r = await SB.rpc("admin_reset_password", { p_user:u.id, p_password:pw });
    if (r.error){ toast("초기화하지 못했습니다: " + realRpcErr(r.error)); return; }
    u.mustChangePw = true; renderMain(); toast(u.name + " 님 비밀번호를 임시 비밀번호로 초기화했습니다.");
  }); });
  host.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", async function(){
    var u = find(this.getAttribute("data-del"));
    if (!window.confirm(u.name + " (" + u.loginId + ") 계정을 삭제할까요?\n이 사용자가 작성한 실습일지·출결·첨부 기록도 함께 지워지며 되돌릴 수 없습니다.")) return;
    var r = await SB.rpc("admin_delete_account", { p_user:u.id });
    if (r.error){ toast("삭제하지 못했습니다: " + realRpcErr(r.error)); return; }
    USERS = USERS.filter(function(x){ return x.id !== u.id; });
    DB.students = DB.students.filter(function(s){ return s.id !== u.id; });
    ["logs","attendance"].forEach(function(k){ DB[k] = DB[k].filter(function(x){ return x.studentId !== u.id; }); });
    delete DB.studentExtra[u.id]; delete DB.placement[u.id]; delete RS.savedProfiles[u.id];
    Object.keys(RS.saved).forEach(function(k){ if (k.indexOf("u:"+u.id+":") === 0) delete RS.saved[k]; });
    renderMain(); toast(u.name + " 계정을 삭제했습니다.");
  }); });
}

/* ---------- 실제 운영 모드 시작 ---------- */
if (REAL){
  var _realRenderMain = renderMain;

  var _realToast = toast;
  toast = function(m){ _realToast(m); realQueueSave(); };
  LOGIN = realLogin; SIGNUP = function(){};
  LOGOUT = function(){ realSave().finally(function(){ SB.auth.signOut().finally(function(){ location.reload(); }); }); };
  RENDER.ADMIN.accounts = realAccounts;
  sessionStudent = function(){ return studentById((SESSION||{}).studentId) || DB.students[0] || { id:"_none", name:"", no:"", school:"", institutionId:"", area:"", start:DB.term.start, end:DB.term.end }; };
  demoUserForRole = function(role){ return (USERS||[]).filter(function(u){ return u.role === role; })[0] || { id:"_view", name:"(조회)", role:role, studentId: role === "STUDENT" ? ((DB.students[0]||{}).id) : undefined }; };
  setInterval(realQueueSave, 5000);
  window.addEventListener("beforeunload", function(e){ if (RS.me && (RS.busy || RS.err)){ e.preventDefault(); e.returnValue = ""; } });
  document.addEventListener("change", function(e){
    var inp = e.target; if (!RS.me || inp.type !== "file" || !inp.files || !inp.files[0]) return;
    var key = realFileKey(inp); if (!key) return;
    var f = inp.files[0];
    if (f.size > 10*1024*1024){ toast("10MB 이하 파일만 올릴 수 있습니다 (" + (f.size/1048576).toFixed(1) + "MB)."); return; }
    realSetState("busy");
    realUpload(f, key).then(function(){ RS.lastAt = new Date().toISOString(); realSetState("ok"); toast("파일을 저장했습니다: " + f.name); }).catch(function(err){ realSetState("err", err.message); toast("파일을 저장하지 못했습니다: " + pfErr(err)); });
  }, true);
  BOOT = function(){
    try {
      realReset();
      realAuthUI();
      var lg = $("lgBtn"); if (lg) lg.addEventListener("click", realLogin);
      var p1 = $("lgPw"); if (p1) p1.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); realLogin(); } });
      $("loginBox").hidden = false;
      SB.auth.getSession().then(function(r){
        var s = r.data && r.data.session;
        if (s && s.user) realEnter(s.user).catch(function(e){ realMsg("lgMsg", "불러오지 못했습니다: " + e.message); });
      });
    } catch (e){ report("초기화 오류: " + (e && e.message ? e.message : e)); }
  };
}

/* 학교 행정: 학생 필수 서류 수신 확인 (학생이 올린 실제 파일 열람) */
function realStudentDocs(){
  var host = pbody(); if (!host) return;
  var ST = { NONE:["미제출","b-slate"], SUBMITTED:["확인 대기","b-amber"], VERIFIED:["수신 완료","b-teal"], REJECTED:["반려","b-rose"] };
  var rows = DB.students.map(function(s){
    var ex = DB.studentExtra[s.id] || { docs:{} };
    return '<tr><td><b>'+esc(s.name)+'</b><div class="tiny">'+esc(s.no)+'</div></td>' + DB.reqDocList.map(function(rd){
      var st = (ex.docs||{})[rd.id] || "NONE", f = (RS.files[s.id]||{})["doc."+rd.id];
      return '<td>'+badge(ST, st)+(f?'<div><button type="button" class="lnk sm" data-rfile="'+s.id+'|doc.'+rd.id+'">파일 보기</button></div>':'')+
        (st==="SUBMITTED"?'<div style="margin-top:4px"><button type="button" class="btn btn-sm btn-teal" data-vd="'+s.id+'|'+rd.id+'|VERIFIED">확인</button> <button type="button" class="btn btn-sm btn-danger" data-vd="'+s.id+'|'+rd.id+'|NONE">반려</button></div>':'')+'</td>';
    }).join("") + '</tr>';
  }).join("");
  host.appendChild(h('<div id="realStuDocs" style="margin-top:22px"><div class="grouphd">학생 필수 서류 수신 확인</div>'+tbl(["학생"].concat(DB.reqDocList.map(function(r){ return r.name; })), rows || '<tr><td colspan="'+(DB.reqDocList.length+1)+'" class="empty">학생이 없습니다.</td></tr>')+'</div>'));
  host.querySelectorAll("[data-vd]").forEach(function(b){ b.addEventListener("click", function(){
    var p = this.getAttribute("data-vd").split("|"), ex = DB.studentExtra[p[0]]; if (!ex) return;
    ex.docs = ex.docs || {}; ex.docs[p[1]] = p[2]; renderMain(); toast(p[2] === "VERIFIED" ? "수신 확인했습니다." : "반려했습니다. 학생이 다시 올려야 합니다.");
  }); });
}

/* 서식 관리표·안내문 정리: 'AI 역량 기반 자기소개서' → '자기소개서', 'AI 아이디어 노트 과제' 삭제, 실습 종료 보고서에서 'AI 과제 제안서' 삭제 */
function docTextFix(){
  (DB.docCats||[]).forEach(function(c){
    if (!Array.isArray(c.items)) return;
    c.items = c.items.filter(function(x){ return x !== "AI 아이디어 노트 과제"; }).map(function(x){
      return x === "AI 역량 기반 자기소개서" ? "자기소개서" : x === "실습 종료 보고서(소감문·AI 과제 제안서)" ? "실습 종료 보고서(소감문)" : x;
    });
  });
  function fx(t){ return typeof t === "string" ? t.replace("소감문·AI 과제 제안서를 포함한", "소감문을 포함한").replace("(소감문·AI 과제 제안서)", "(소감문)") : t; }
  if (DB.guide && Array.isArray(DB.guide.student)) DB.guide.student = DB.guide.student.map(fx);
  (DB.handbook||[]).forEach(function(x){ x.body = fx(x.body); });
}
